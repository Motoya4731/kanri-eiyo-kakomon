<!doctype html>
<html lang="ja">
<head>

<title>管理栄養士国試 過去問</title>
<style>
:root {
  --bg: #f6f8f7; --surface: #ffffff; --text: #1b1f1d; --muted: #5d6762; --line: #dce3df;
  --accent: #1d6b52; --accent-soft: #e4f2ec; --ok: #1f7a4d; --ok-soft: #e5f4ec; --ng: #b42318; --ng-soft: #fdecea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1d2421; --text: #e8eeeb; --muted: #9aa8a1; --line: #323d38;
    --accent: #6fcca7; --accent-soft: #1d3a2f; --ok: #5cc28e; --ok-soft: #1d3328; --ng: #f2867b; --ng-soft: #3b2220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1d2421; --text: #e8eeeb; --muted: #9aa8a1; --line: #323d38;
  --accent: #6fcca7; --accent-soft: #1d3a2f; --ok: #5cc28e; --ok-soft: #1d3328; --ng: #f2867b; --ng-soft: #3b2220; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; line-height: 1.7; }
main { max-width: 860px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 1.35rem; margin: 8px 0 4px; }
h2 { font-size: 1.05rem; margin: 22px 0 8px; }
.sub { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
label.row { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
label.row input { margin-top: 6px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; }
.mode { display: grid; gap: 8px; }
.mode button { text-align: left; }
.mode b { display: block; }
.mode span { color: var(--muted); font-size: .85rem; }
button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
button.on span { color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 12px; font-size: 1rem; }
:root[data-theme="dark"] button.primary { color: #0b1f17; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0b1f17; } }
button:disabled { opacity: .45; cursor: default; }
#input button:disabled { opacity: 1; color: var(--muted); }
#input button.correct, #input button.wrong { font-weight: 700; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link { border: 0; background: none; color: var(--muted); padding: 4px 0; text-decoration: underline; }
.mini { font-size: .8rem; padding: 2px 10px; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; gap: 8px; }
.tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: .8rem; }
.page { width: 100%; display: block; background: #fff; border-radius: 6px; cursor: zoom-in; }
:root[data-theme="dark"] .page { filter: brightness(.92); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .page { filter: brightness(.92); } }
.qtext { font-size: 1rem; }
.qtext p { margin: 0 0 6px; }
.qtext p.ch { padding-left: 1.2em; }
.qtext .stem { border-left: 3px solid var(--line); padding-left: 10px; margin-bottom: 12px; color: var(--text); }
.qtext img.fig { max-width: 100%; display: block; margin: 8px 0; background: #fff; border-radius: 6px; cursor: zoom-in; }
.hint { color: var(--muted); font-size: .78rem; margin: 4px 0 10px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { min-width: 3.4em; font-weight: 700; font-size: 1.1rem; padding: 10px 14px; }
.correct { border-color: var(--ok) !important; background: var(--ok-soft) !important; color: var(--ok) !important; }
.wrong { border-color: var(--ng) !important; background: var(--ng-soft) !important; color: var(--ng) !important; }
.verdict { font-size: 1.15rem; font-weight: 700; margin: 4px 0; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.source { border-left: 3px solid var(--accent); padding: 2px 10px; margin: 8px 0 12px; }
.big { font-size: 2.2rem; font-weight: 700; margin: 4px 0; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.stack > * + * { margin-top: 10px; }
.zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); overflow: auto; z-index: 20; padding: env(safe-area-inset-top, 0px) 0 0; }
.zoom img { width: 200%; max-width: none; display: block; background: #fff; }
@media (min-width: 900px) { .zoom img { width: 140%; } }
.zoom button { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); background: #fff; color: #000; }
.foot { color: var(--muted); font-size: .78rem; margin-top: 32px; }
.subj { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.subj:last-child { border-bottom: 0; }
.subj .sub { margin: 0; white-space: nowrap; }
</style>

<script>
const DATA = [{"id":"37-001","exam":37,"num":1,"subject":1,"qhtml":"<p><b>1<\/b>　一次、二次および三次予防に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）住民を対象とするがん検診は、一次予防である。<\/p><p class=\"ch\">（2）ヒトパピローマウイルス(HPV)ワクチン接種は、二次予防である。<\/p><p class=\"ch\">（3）脳梗塞発症後の機能回復訓練は、二次予防である。<\/p><p class=\"ch\">（4）職場におけるストレスチェックは、三次予防である。<\/p><p class=\"ch\">（5）精神障害者に対する社会復帰支援は、三次予防である。<\/p>","choices":5,"answer":5},{"id":"37-002","exam":37,"num":2,"subject":1,"qhtml":"<p><b>2<\/b>　熱中症とその予防・治療に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）予防のための指標として、湿球黒球温度(WBGT)がある。<\/p><p class=\"ch\">（2）意識障害がみられたら、熱中症Ⅰ度と判定する。<\/p><p class=\"ch\">（3）起座呼吸(起坐呼吸)がみられたら、熱中症Ⅱ度と判定する。<\/p><p class=\"ch\">（4）めまい、立ちくらみがみられたら、熱中症Ⅲ度と判定する。<\/p><p class=\"ch\">（5）熱痙攣の発症直後には、電解質を含まない水を与える。<\/p>","choices":5,"answer":1},{"id":"37-003","exam":37,"num":3,"subject":1,"qhtml":"<p><b>3<\/b>　上水道および水質に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）クリプトスポリジウムは、塩素消毒で死滅する。<\/p><p class=\"ch\">（2）水道水の水質基準では、一般細菌は「検出されないこと」となっている。<\/p><p class=\"ch\">（3）水道水の水質基準では、pHの基準値が定められている。<\/p><p class=\"ch\">（4）水道水の水質基準では、水銀の量に関して「検出されないこと」となっている。<\/p><p class=\"ch\">（5）生物化学的酸素要求量が低いほど、水質は汚濁している。<\/p>","choices":5,"answer":3},{"id":"37-004","exam":37,"num":4,"subject":1,"qhtml":"<p><b>4<\/b>　ある年のA地域とB地域における年齢階級別(15～49歳)の女性の人口と出生の状況を表に示した。両地域の比較に関して、この表から読み取れる内容である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）A地域で15～19歳と20～24歳の出生率が高いのは、子育てしやすい環境による。<\/p><p class=\"ch\">（2）B地域で40～44歳と45～49歳の出生率が高いのは、晩婚化の影響による。<\/p><p class=\"ch\">（3）総再生産率は、A地域で高い。<\/p><p class=\"ch\">（4）純再生産率は、A地域で高い。<\/p><p class=\"ch\">（5）合計特殊出生率は、B地域で高い。<\/p><img class=\"fig\" src=\"img/q37_image1.jpg\" alt=\"図表\" data-zoom=\"img/q37_image1.jpg\">","choices":5,"answer":5},{"id":"37-005","exam":37,"num":5,"subject":1,"qhtml":"<p><b>5<\/b>　わが国の平均寿命に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）0歳の死亡率が低下すると、平均寿命は短くなる。<\/p><p class=\"ch\">（2）平均寿命は、各年齢に対して算出される。<\/p><p class=\"ch\">（3）平均寿命は、全ての年齢の死亡状況を集約したものである。<\/p><p class=\"ch\">（4）平均寿命は、WHOで採用している障害調整生存年数(DALYs)を用いて算出される。<\/p><p class=\"ch\">（5）健康日本21(第二次)では、平均寿命について、健康寿命の増加分を上回る延びを目指している。<\/p>","choices":5,"answer":3},{"id":"37-006","exam":37,"num":6,"subject":1,"qhtml":"<p><b>6<\/b>　対象集団の有病率とスクリーニングの精度に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）有病率が高くなると、敏感度は低くなる。<\/p><p class=\"ch\">（2）有病率が高くなると、特異度は高くなる。<\/p><p class=\"ch\">（3）有病率が高くなると、偽陽性率は高くなる。<\/p><p class=\"ch\">（4）有病率が低くなると、陽性反応的中度は低くなる。<\/p><p class=\"ch\">（5）有病率が低くなると、陰性反応的中度は低くなる。<\/p>","choices":5,"answer":4},{"id":"37-007","exam":37,"num":7,"subject":1,"qhtml":"<p><b>7<\/b>　身体活動に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）身体活動の増加は、大腸がんの発症リスクを低減する。<\/p><p class=\"ch\">（2）国民健康・栄養調査によると、20歳以上の1日の歩数の平均値は、男女とも平成22年以降8,000歩を超えている。<\/p><p class=\"ch\">（3）国民健康・栄養調査では、運動習慣のある者の定義を「1回60分以上の運動を週4回以上実施し、1年以上継続している者」としている。<\/p><p class=\"ch\">（4）「健康づくりのための身体活動基準2013」では、18歳未満に対して、世代共通の方向性に加えて、定量的な身体活動の基準が定められている。<\/p><p class=\"ch\">（5）身体活動の強度の指標として用いられるメッツ（METs）は、身体活動時のエネルギー消費量を基礎代謝量で除した値である。<\/p>","choices":5,"answer":1},{"id":"37-008","exam":37,"num":8,"subject":1,"qhtml":"<p><b>8<\/b>　飲酒に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）健康日本21(第二次)では、「生活習慣病のリスクを高める飲酒量」を、1日当たりの純アルコール量で男女とも40g以上としている。<\/p><p class=\"ch\">（2）健康日本21(第二次)では、妊娠中に飲酒する者をなくすことを目標としている。<\/p><p class=\"ch\">（3）アルコール依存症の発症リスクは、飲酒開始年齢と関係がない。<\/p><p class=\"ch\">（4）1日平均飲酒量が増加するほど、血圧は低下する。<\/p><p class=\"ch\">（5）アルコールには、身体依存はない。<\/p>","choices":5,"answer":2},{"id":"37-009","exam":37,"num":9,"subject":1,"qhtml":"<p><b>9<\/b>　循環器疾患の疫学に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）高血圧症のリスク因子として、カリウムの過剰摂取がある。<\/p><p class=\"ch\">（2）脳梗塞のリスク因子として、血清総コレステロールの低値がある。<\/p><p class=\"ch\">（3）虚血性心疾患のリスク因子として、血清LDLコレステロールの低値がある。<\/p><p class=\"ch\">（4）健康日本21(第二次)では、脳血管疾患・虚血性心疾患のリスク因子として、高血圧、脂質異常症、喫煙、糖尿病を挙げている。<\/p><p class=\"ch\">（5）最近10年間のわが国の虚血性心疾患による年齢調整死亡率は、米国よりも高い。<\/p>","choices":5,"answer":4},{"id":"37-010","exam":37,"num":10,"subject":1,"qhtml":"<p><b>10<\/b>　わが国の成人の肥満とメタボリックシンドロームに関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）平成22年以降の国民健康・栄養調査結果では、肥満者の割合は、男女とも30歳台にピークがある。<\/p><p class=\"ch\">（2）BMI 35kg/m<sup>2<\/sup>以上を、高度肥満と定義する。<\/p><p class=\"ch\">（3）メタボリックシンドロームの診断基準では、空腹時血糖値は100mg/dL以上である。<\/p><p class=\"ch\">（4）メタボリックシンドロームの診断基準には、LDLコレステロールが含まれる。<\/p><p class=\"ch\">（5）特定健康診査・特定保健指導の対象者は、30～74歳である。<\/p>","choices":5,"answer":2},{"id":"37-011","exam":37,"num":11,"subject":1,"qhtml":"<p><b>11<\/b>　感染症法における1～5類感染症に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）コレラは、1類感染症である。<\/p><p class=\"ch\">（2）痘そうは、2類感染症である。<\/p><p class=\"ch\">（3）細菌性赤痢は、3類感染症である。<\/p><p class=\"ch\">（4）ペストは、4類感染症である。<\/p><p class=\"ch\">（5）結核は、5類感染症である。<\/p>","choices":5,"answer":3},{"id":"37-012","exam":37,"num":12,"subject":1,"qhtml":"<p><b>12<\/b>　児童虐待防止法において、児童虐待と規定されている行為である。<\/p><p>誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）身体的虐待<\/p><p class=\"ch\">（2）性的虐待<\/p><p class=\"ch\">（3）ネグレクト<\/p><p class=\"ch\">（4）心理的虐待<\/p><p class=\"ch\">（5）経済的虐待<\/p>","choices":5,"answer":5},{"id":"37-013","exam":37,"num":13,"subject":1,"qhtml":"<p><b>13<\/b>　わが国の社会保障における4つの柱(社会保険、社会福祉、公的扶助、保健医療・公衆衛生)に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）予防接種を行うのは、保健医療・公衆衛生である。<\/p><p class=\"ch\">（2）高齢者に年金を給付するのは、社会福祉である。<\/p><p class=\"ch\">（3）生活保護は、社会保険である。<\/p><p class=\"ch\">（4）社会的弱者を援護育成するのは、公的扶助である。<\/p><p class=\"ch\">（5）医療機関での現物給付を行うのは、社会福祉である。<\/p>","choices":5,"answer":1},{"id":"37-014","exam":37,"num":14,"subject":1,"qhtml":"<p><b>14<\/b>　わが国のデータヘルス計画に関する記述である。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）医療法に基づいて策定される。<\/p><p class=\"ch\">（2）保険者がレセプトのデータを分析し、活用する。<\/p><p class=\"ch\">（3）被保険者のQOLの改善に役立てる。<\/p><p class=\"ch\">（4）医療費の適正化を目指している。<\/p><p class=\"ch\">（5）保健事業計画の策定に役立てる。<\/p>","choices":5,"answer":1},{"id":"37-015","exam":37,"num":15,"subject":1,"qhtml":"<p><b>15<\/b>　地域保健に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）都道府県以外は、保健所を設置できない。<\/p><p class=\"ch\">（2）結核発生時の接触者健康診断は、保健所の業務である。<\/p><p class=\"ch\">（3）医療機関の監視は、市町村保健センターの業務である。<\/p><p class=\"ch\">（4）食品衛生の監視は、市町村保健センターの業務である。<\/p><p class=\"ch\">（5）人口動態統計に関する業務は、市町村保健センターによって行われる。<\/p>","choices":5,"answer":2},{"id":"37-016","exam":37,"num":16,"subject":1,"qhtml":"<p><b>16<\/b>　介護保険制度に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）保険者は、国である。<\/p><p class=\"ch\">（2）被保険者は、30歳以上の者である。<\/p><p class=\"ch\">（3）要介護状態は、介護の必要の程度に応じて区分される。<\/p><p class=\"ch\">（4）要介護認定は、主治医により行われる。<\/p><p class=\"ch\">（5）要介護度に応じて利用するサービスについて、利用者自身が選択・決定することはできない。<\/p>","choices":5,"answer":3},{"id":"37-017","exam":37,"num":17,"subject":2,"qhtml":"<p><b>17<\/b>　線毛を持つ上皮で内腔が覆われる器官である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）血管<\/p><p class=\"ch\">（2）気管<\/p><p class=\"ch\">（3）食道<\/p><p class=\"ch\">（4）小腸<\/p><p class=\"ch\">（5）膀胱<\/p>","choices":5,"answer":2},{"id":"37-018","exam":37,"num":18,"subject":2,"qhtml":"<p><b>18<\/b>　脂肪酸に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）脂肪酸は、カルボキシ基を持つ。<\/p><p class=\"ch\">（2）脂肪酸は、二重結合が多くなるほど酸化を受けにくい。<\/p><p class=\"ch\">（3）カプリル酸は、長鎖脂肪酸である。<\/p><p class=\"ch\">（4）リノール酸は、体内で合成される。<\/p><p class=\"ch\">（5）オレイン酸は、飽和脂肪酸である。<\/p>","choices":5,"answer":1},{"id":"37-019","exam":37,"num":19,"subject":2,"qhtml":"<p><b>19<\/b>　核酸の構造と機能に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）DNAの構成糖は、リボースである。<\/p><p class=\"ch\">（2）ヒストンは、DNAと複合体を形成する。<\/p><p class=\"ch\">（3）クロマチンの主成分は、RNAである。<\/p><p class=\"ch\">（4）mRNAは、アミノ酸と結合する部位を持つ。<\/p><p class=\"ch\">（5）イントロンは、転写されない。<\/p>","choices":5,"answer":2},{"id":"37-020","exam":37,"num":20,"subject":2,"qhtml":"<p><b>20<\/b>　酵素に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）酵素は、化学反応の活性化エネルギーを増大させる。<\/p><p class=\"ch\">（2）競合阻害では、反応の最大速度(V<sub>max<\/sub>)は低下する。<\/p><p class=\"ch\">（3）競合阻害物質は、活性部位に結合する。<\/p><p class=\"ch\">（4）ミカエリス定数(K<sub>m<\/sub>)は、親和性の高い基質で大きくなる。<\/p><p class=\"ch\">（5）トリプシノーゲンは、リン酸化により活性化される。<\/p>","choices":5,"answer":3},{"id":"37-021","exam":37,"num":21,"subject":2,"qhtml":"<p><b>21<\/b>　糖質代謝に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）グリセロールは、グリコーゲンの分解により生じる。<\/p><p class=\"ch\">（2）ヘキソキナーゼは、グルコースを基質とする。<\/p><p class=\"ch\">（3）グルコース輸送体4(GLUT4)は、肝細胞に存在する。<\/p><p class=\"ch\">（4）アラニンは、筋肉でグルコースに変換される。<\/p><p class=\"ch\">（5）ロイシンは、糖原性アミノ酸である。<\/p>","choices":5,"answer":2},{"id":"37-022","exam":37,"num":22,"subject":2,"qhtml":"<p><b>22<\/b>　酸塩基平衡に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）血液のpHは、7.0±0.05に維持されている。<\/p><p class=\"ch\">（2）呼吸性アシドーシスでは、腎臓から水素イオン(H<sup>+<\/sup>)の排泄が促進される。<\/p><p class=\"ch\">（3）代謝性アシドーシスでは、呼吸数が減少する。<\/p><p class=\"ch\">（4）腎機能が低下すると、腎臓での重炭酸イオンの再吸収が促進される。<\/p><p class=\"ch\">（5）ケトン体が増加すると、代謝性アルカローシスになる。<\/p>","choices":5,"answer":2},{"id":"37-023","exam":37,"num":23,"subject":2,"qhtml":"<p><b>23<\/b>　疾患に伴う変化に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）壊死は、炎症を引き起こす。<\/p><p class=\"ch\">（2）急性炎症では、血管透過性は低下する。<\/p><p class=\"ch\">（3）腸上皮化生は、小腸で見られる。<\/p><p class=\"ch\">（4）播種は、良性腫瘍の進展様式である。<\/p><p class=\"ch\">（5）植物状態では、脳幹の機能が失われている。<\/p>","choices":5,"answer":1},{"id":"37-024","exam":37,"num":24,"subject":2,"qhtml":"<p><b>24<\/b>　臨床検査に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）溶血性貧血による高ビリルビン血症では、直接ビリルビンが優位になる。<\/p><p class=\"ch\">（2）血中CRP値は、炎症で低下する。<\/p><p class=\"ch\">（3）抗GAD(抗グルタミン酸脱炭酸酵素)抗体は、自己抗体である。<\/p><p class=\"ch\">（4）腹部エコー検査は、妊娠中の女性には禁忌である。<\/p><p class=\"ch\">（5）MRI検査は、X線を利用して画像を得る。<\/p>","choices":5,"answer":3},{"id":"37-025","exam":37,"num":25,"subject":2,"qhtml":"<p><b>25<\/b>　治療に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）発熱の患者に対する解熱鎮痛薬投与は、原因療法である。<\/p><p class=\"ch\">（2）交差適合試験は、輸血の後に行う。<\/p><p class=\"ch\">（3）早期胃がんに対する手術療法は、対症療法である。<\/p><p class=\"ch\">（4）放射線治療では、正常細胞は影響を受けない。<\/p><p class=\"ch\">（5）緩和ケアは、がんの診断初期から行う。<\/p>","choices":5,"answer":5},{"id":"37-026","exam":37,"num":26,"subject":2,"qhtml":"<p><b>26<\/b>　ホルモンの分泌と働きに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ソマトスタチンは、インスリン分泌を促進する。<\/p><p class=\"ch\">（2）グルカゴンは、糖新生を抑制する。<\/p><p class=\"ch\">（3）アディポネクチンは、インスリン抵抗性を増大させる。<\/p><p class=\"ch\">（4）レプチンは、食欲を抑制する。<\/p><p class=\"ch\">（5）血中グレリン値は、空腹時に低下する。<\/p>","choices":5,"answer":4},{"id":"37-027","exam":37,"num":27,"subject":2,"qhtml":"<p><b>27<\/b>　消化器系の構造と機能に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）味蕾は、全ての舌乳頭に存在する。<\/p><p class=\"ch\">（2）膵液は、回腸に分泌される。<\/p><p class=\"ch\">（3）S状結腸は、回腸と上行結腸の間にある。<\/p><p class=\"ch\">（4）迷走神経の興奮は、胃酸の分泌を促進する。<\/p><p class=\"ch\">（5）GLP-1は、胃内容物の排出を促進する。<\/p>","choices":5,"answer":4},{"id":"37-028","exam":37,"num":28,"subject":2,"qhtml":"<p><b>28<\/b>　肝疾患の検査に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）アルコール性肝炎では、血清γ-GT値は低下する。<\/p><p class=\"ch\">（2）ウイルス性慢性肝炎は、B型肝炎ウイルスによるものが最も多い。<\/p><p class=\"ch\">（3）肝硬変では、血清コリンエステラーゼ値は上昇する。<\/p><p class=\"ch\">（4）非代償期の肝硬変では、血液中のBCAA値が上昇する。<\/p><p class=\"ch\">（5）NASHの確定診断には、肝生検が必要である。<\/p>","choices":5,"answer":5},{"id":"37-029","exam":37,"num":29,"subject":2,"qhtml":"<p><b>29<\/b>　循環器系の構造と機能に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）左心室の壁厚は、右心室の壁厚よりも薄い。<\/p><p class=\"ch\">（2）洞房結節は、左心房にある。<\/p><p class=\"ch\">（3）胸管は、右鎖骨下動脈に流入する。<\/p><p class=\"ch\">（4）門脈を流れる血液は、動脈血である。<\/p><p class=\"ch\">（5）血圧上昇により大動脈弓の圧受容体が刺激されると、心拍数は低下する。<\/p>","choices":5,"answer":5},{"id":"37-030","exam":37,"num":30,"subject":2,"qhtml":"<p><b>30<\/b>　循環器疾患に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）狭心症では、心筋壊死が生じる。<\/p><p class=\"ch\">（2）腎血管性高血圧は、本態性高血圧である。<\/p><p class=\"ch\">（3）心室細動は、致死性不整脈である。<\/p><p class=\"ch\">（4）右心不全では、肺水腫が生じる。<\/p><p class=\"ch\">（5）心不全では、血中BNP(脳性ナトリウム利尿ペプチド)値が低下する。<\/p>","choices":5,"answer":3},{"id":"37-031","exam":37,"num":31,"subject":2,"qhtml":"<p><b>31<\/b>　腎・尿路系の構造と機能に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）赤血球は、糸球体基底膜を通過する。<\/p><p class=\"ch\">（2）1日当たりの糸球体濾過量は、約1.5Lである。<\/p><p class=\"ch\">（3）eGFRの算出には、24時間蓄尿が必要である。<\/p><p class=\"ch\">（4）尿のpHの変動は、血液のpHの変動より大きい。<\/p><p class=\"ch\">（5）レニンの分泌は、循環血漿量が減少すると抑制される。<\/p>","choices":5,"answer":4},{"id":"37-032","exam":37,"num":32,"subject":2,"qhtml":"<p><b>32<\/b>　腎疾患に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）高血圧は、ネフローゼ症候群の診断基準に含まれる。<\/p><p class=\"ch\">（2）ネフローゼ症候群では、血清LDLコレステロール値は低下する。<\/p><p class=\"ch\">（3）糖尿病性腎症病期分類での早期腎症期は、顕性アルブミン尿陽性である。<\/p><p class=\"ch\">（4）慢性腎不全では、低リン血症がみられる。<\/p><p class=\"ch\">（5）腹膜透析液のグルコース濃度は、血中のグルコース濃度より高い。<\/p>","choices":5,"answer":5},{"id":"37-033","exam":37,"num":33,"subject":2,"qhtml":"<p><b>33<\/b>　内分泌疾患とホルモンに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）尿崩症では、バソプレシンの分泌が増加する。<\/p><p class=\"ch\">（2）原発性副甲状腺機能亢進症では、血清リン値が低下する。<\/p><p class=\"ch\">（3）原発性アルドステロン症では、血漿レニン活性が上昇する。<\/p><p class=\"ch\">（4）アジソン病では、コルチゾールの分泌が増加する。<\/p><p class=\"ch\">（5）褐色細胞腫では、カテコールアミンの分泌が減少する。<\/p>","choices":5,"answer":2},{"id":"37-034","exam":37,"num":34,"subject":2,"qhtml":"<p><b>34<\/b>　神経系の構造と機能に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）くも膜は、脳の表面に密着している。<\/p><p class=\"ch\">（2）体温調節中枢は、視床にある。<\/p><p class=\"ch\">（3）呼吸中枢は、中脳にある。<\/p><p class=\"ch\">（4）排便反射の中枢は、仙髄にある。<\/p><p class=\"ch\">（5）錐体路は、体性感覚の伝達を行う。<\/p>","choices":5,"answer":4},{"id":"37-035","exam":37,"num":35,"subject":2,"qhtml":"<p><b>35<\/b>　呼吸器系の構造と機能に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）右肺は、2葉からなる。<\/p><p class=\"ch\">（2）気管支平滑筋は、副交感神経の興奮で弛緩する。<\/p><p class=\"ch\">（3）横隔膜は、呼気時に収縮する。<\/p><p class=\"ch\">（4）肺活量は、1回換気量と予備吸気量と予備呼気量の和である。<\/p><p class=\"ch\">（5）外呼吸は、末梢組織における酸素と二酸化炭素のガス交換である。<\/p>","choices":5,"answer":4},{"id":"37-036","exam":37,"num":36,"subject":2,"qhtml":"<p><b>36<\/b>　運動器系に関する記述である。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）日光曝露の不足は、くる病の原因である。<\/p><p class=\"ch\">（2）高リン血症は、骨軟化症の原因である。<\/p><p class=\"ch\">（3）糖尿病は、骨折のリスク因子である。<\/p><p class=\"ch\">（4）脊椎椎体は、骨粗鬆症における骨折の好発部位である。<\/p><p class=\"ch\">（5）DXA(DEXA)法は、骨密度の評価に用いられる。<\/p>","choices":5,"answer":2},{"id":"37-037","exam":37,"num":37,"subject":2,"qhtml":"<p><b>37<\/b>　前立腺に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）前立腺は、腹膜腔内に位置する。<\/p><p class=\"ch\">（2）前立腺から、テストステロンが分泌される。<\/p><p class=\"ch\">（3）前立腺肥大により、排尿障害が生じる。<\/p><p class=\"ch\">（4）前立腺がんでは、血清PSA値が低下する。<\/p><p class=\"ch\">（5）前立腺がんの進行は、アンドロゲンによって抑制される。<\/p>","choices":5,"answer":3},{"id":"37-038","exam":37,"num":38,"subject":2,"qhtml":"<p><b>38<\/b>　血液系に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）末梢血中の赤血球は、核を持つ。<\/p><p class=\"ch\">（2）好中球は、抗体を産生する。<\/p><p class=\"ch\">（3）単球が血管外へ遊走すると、形質細胞となる。<\/p><p class=\"ch\">（4）フィブリンは、トロンビンによりフィブリノーゲンに変換される。<\/p><p class=\"ch\">（5）PAI-1は、脂肪細胞で産生される。<\/p>","choices":5,"answer":5},{"id":"37-039","exam":37,"num":39,"subject":2,"qhtml":"<p><b>39<\/b>　25歳、女性。易疲労感があり来院した。血液検査結果でWBC1,060/μL、RBC186万/μL、Hb5.8g/dL、血小板8万/μL、網赤血球1‰(基準値2～27‰)、MCV91.3fL(基準値80～98fL)、MCH31.1pg(基準値28～32pg)、MCHC34.1％(基準値30～36％)、Cr0.6mg/dL、総ビリルビン0.3mg/dLであった。考えられる疾患として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）鉄欠乏性貧血<\/p><p class=\"ch\">（2）ビタミンB<sub>12<\/sub>欠乏性貧血<\/p><p class=\"ch\">（3）再生不良性貧血<\/p><p class=\"ch\">（4）溶血性貧血<\/p>","choices":4,"answer":3},{"id":"37-040","exam":37,"num":40,"subject":2,"qhtml":"<p><b>40<\/b>　免疫及びアレルギーに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）抗体は、マクロファージにより産生される。<\/p><p class=\"ch\">（2）分泌型IgAは、消化管の免疫を担う。<\/p><p class=\"ch\">（3）自己免疫性溶血性貧血は、Ⅰ型アレルギーの機序で起こる。<\/p><p class=\"ch\">（4）ツベルクリン反応は、Ⅲ型アレルギーの機序で起こる。<\/p><p class=\"ch\">（5）アナフィラキシーショックは、Ⅳ型アレルギーにより発症する。<\/p>","choices":5,"answer":2},{"id":"37-041","exam":37,"num":41,"subject":2,"qhtml":"<p><b>41<\/b>　食物アレルギーに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）Ⅱ型アレルギーによって発症する。<\/p><p class=\"ch\">（2）乳糖不耐症は、食物アレルギーである。<\/p><p class=\"ch\">（3）口腔アレルギー症候群は、食物アレルギーの特殊型である。<\/p><p class=\"ch\">（4）食物経口負荷試験は、自宅で行う。<\/p><p class=\"ch\">（5）アナフィラキシーショックでは、抗ヒスタミン薬の投与が第一選択である。<\/p>","choices":5,"answer":3},{"id":"37-042","exam":37,"num":42,"subject":2,"qhtml":"<p><b>42<\/b>　感染症に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）宿主は、感染症の原因となる微生物である。<\/p><p class=\"ch\">（2）潜伏期は、症状が改善した後でも病原体が残存している期間である。<\/p><p class=\"ch\">（3）不顕性感染とは、感染しても症状が現れない感染をいう。<\/p><p class=\"ch\">（4）結核は、新興感染症である。<\/p><p class=\"ch\">（5）再興感染症とは、同一患者に繰り返し発症する感染症をいう。<\/p>","choices":5,"answer":3},{"id":"37-043","exam":37,"num":43,"subject":3,"qhtml":"<p><b>43<\/b>　人間と食品に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）人間は、食物連鎖の二次消費者に位置している。<\/p><p class=\"ch\">（2）個人の食嗜好は、幼児期から高齢期に至るまで変化しない。<\/p><p class=\"ch\">（3）わが国の生産額ベースの総合食料自給率は、2000年以降約60～70％で推移している。<\/p><p class=\"ch\">（4）フードマイレージは、地産地消が進むと大きくなる。<\/p><p class=\"ch\">（5）食品ロスは、生産された食料のうち不可食部の廃棄を示している。<\/p>","choices":5,"answer":3},{"id":"37-044","exam":37,"num":44,"subject":3,"qhtml":"<p><b>44<\/b>　野菜類の成分に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ほうれんそうのシュウ酸は、腸管でのカルシウムの吸収を促進する。<\/p><p class=\"ch\">（2）にんじんのβ-カロテンは、光照射によって色調が変化する。<\/p><p class=\"ch\">（3）なすのナスニンは、金属イオンに対するキレート作用で退色する。<\/p><p class=\"ch\">（4）だいこんのイソチオシアネート類は、リポキシゲナーゼの作用で生成する。<\/p><p class=\"ch\">（5）きゅうりのノナジエナールは、ミロシナーゼの作用で生成する。<\/p>","choices":5,"answer":2},{"id":"37-045","exam":37,"num":45,"subject":3,"qhtml":"<p><b>45<\/b>　魚介類に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）はまちの若年魚は、ぶりである。<\/p><p class=\"ch\">（2）春獲りのかつおは、戻りがつおと呼ばれる。<\/p><p class=\"ch\">（3）辛子めんたいこは、まだらの卵巣の塩蔵品である。<\/p><p class=\"ch\">（4）キャビアは、にしんの卵巣の塩蔵品である。<\/p><p class=\"ch\">（5）からすみは、ぼらの卵巣の塩蔵品である。<\/p>","choices":5,"answer":5},{"id":"37-046","exam":37,"num":46,"subject":3,"qhtml":"<p><b>46<\/b>　牛乳の成分に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）乳糖は、全糖質の約5％を占める。<\/p><p class=\"ch\">（2）脂肪酸組成では、不飽和脂肪酸より飽和脂肪酸が多い。<\/p><p class=\"ch\">（3）カゼインホスホペプチドは、カルシウムの吸収を阻害する。<\/p><p class=\"ch\">（4）乳清たんぱく質は、全たんぱく質の約80％を占める。<\/p><p class=\"ch\">（5）β-ラクトグロブリンは、人乳にも含まれる。<\/p>","choices":5,"answer":2},{"id":"37-047","exam":37,"num":47,"subject":3,"qhtml":"<p><b>47<\/b>　鶏卵に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）オボトランスフェリンは、起泡性に優れる。<\/p><p class=\"ch\">（2）アビジンは、ナイアシンと強く結合する。<\/p><p class=\"ch\">（3）ホスビチンは、たんぱく質分解酵素である。<\/p><p class=\"ch\">（4）脂溶性ビタミンは、卵黄より卵白に多く含まれる。<\/p><p class=\"ch\">（5）卵白は古くなると、pHが低下する。<\/p>","choices":5,"answer":1},{"id":"37-048","exam":37,"num":48,"subject":3,"qhtml":"<p><b>48<\/b>　主にまぐろや青魚から摂取されるn-3系脂肪酸である。この脂肪酸の構造式として、最も適当なのはどれか。1つ選べ。<\/p><img class=\"fig\" src=\"img/q37_image2.jpg\" alt=\"図表\" data-zoom=\"img/q37_image2.jpg\">","choices":4,"answer":3},{"id":"37-049","exam":37,"num":49,"subject":3,"qhtml":"<p><b>49<\/b>　可食部100g当たりの標準的な栄養成分含有量に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）薄力粉のたんぱく質含有量は、強力粉より多い。<\/p><p class=\"ch\">（2）乾燥小豆の脂質含有量は、乾燥大豆より多い。<\/p><p class=\"ch\">（3）ラードの飽和脂肪酸含有量は、なたね油より多い。<\/p><p class=\"ch\">（4）生しいたけのビタミンD含有量は、乾しいたけより多い。<\/p><p class=\"ch\">（5）柿のビタミンB<sub>12<\/sub>含有量は、牡蠣より多い。<\/p>","choices":5,"answer":3},{"id":"37-050","exam":37,"num":50,"subject":3,"qhtml":"<p><b>50<\/b>　食品成分とその分析方法の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）たんぱく質 ――― ケルダール法<\/p><p class=\"ch\">（2）脂質 ――― プロスキー法<\/p><p class=\"ch\">（3）脂肪酸 ――― カールフィッシャー法<\/p><p class=\"ch\">（4）炭水化物 ――― 原子吸光光度法<\/p><p class=\"ch\">（5）ナトリウム ――― ガスクロマトグラフ法<\/p>","choices":5,"answer":1},{"id":"37-051","exam":37,"num":51,"subject":3,"qhtml":"<p><b>51<\/b>　食品の変質に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）細菌による食品の腐敗は、水分活性の低下により促進される。<\/p><p class=\"ch\">（2）揮発性塩基窒素は、たんぱく質の変質が進行すると減少する。<\/p><p class=\"ch\">（3）K値は、ATP関連物質中におけるイノシンの割合が増加すると低下する。<\/p><p class=\"ch\">（4）酸価は、油脂中の遊離脂肪酸量が増加すると低下する。<\/p><p class=\"ch\">（5）過酸化物価は、油脂の自動酸化の初期に上昇する。<\/p>","choices":5,"answer":5},{"id":"37-052","exam":37,"num":52,"subject":3,"qhtml":"<p><b>52<\/b>　細菌性食中毒に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）カンピロバクター食中毒の潜伏期間は、1～5時間程度である。<\/p><p class=\"ch\">（2）サルモネラ食中毒の原因食品は、主に発酵食品である。<\/p><p class=\"ch\">（3）ウェルシュ菌は、 好気的条件で増殖しやすい。<\/p><p class=\"ch\">（4）セレウス菌の嘔吐毒であるセレウリドは、耐熱性である。<\/p><p class=\"ch\">（5）乳児ボツリヌス症の原因食品は、主に粉乳である。<\/p>","choices":5,"answer":4},{"id":"37-053","exam":37,"num":53,"subject":3,"qhtml":"<p><b>53<\/b>　自然毒食中毒と、その原因となる毒素の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）フグによる食中毒 ――― パリトキシン<\/p><p class=\"ch\">（2）ムール貝による食中毒 ――― サキシトキシン<\/p><p class=\"ch\">（3）トリカブトによる食中毒 ――― リナマリン<\/p><p class=\"ch\">（4）スイセンによる食中毒 ――― ソラニン<\/p><p class=\"ch\">（5）ツキヨタケによる食中毒 ――― アコニチン<\/p>","choices":5,"answer":2},{"id":"37-054","exam":37,"num":54,"subject":3,"qhtml":"<p><b>54<\/b>　経口感染症、人畜共通感染症および寄生虫症に関する記述である。<\/p><p>誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）コレラの主症状は、激しい下痢である。<\/p><p class=\"ch\">（2）リステリア症は、人畜共通感染症である。<\/p><p class=\"ch\">（3）トキソプラズマは、猫の糞便から感染する。<\/p><p class=\"ch\">（4）有鉤条虫は、主にサケ・マスの生食から感染する。<\/p><p class=\"ch\">（5）サルコシスティスは、-20℃48時間以上の凍結で死滅する。<\/p>","choices":5,"answer":4},{"id":"37-055","exam":37,"num":55,"subject":3,"qhtml":"<p><b>55<\/b>　放射性物質に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）食品摂取を介しての被曝は、外部被曝といわれる。<\/p><p class=\"ch\">（2）わが国における食品中の放射性物質の基準値は、プルトニウムが対象である。<\/p><p class=\"ch\">（3）ヨウ素131の物理学的半減期は、約8日である。<\/p><p class=\"ch\">（4）ストロンチウム90は、筋肉に集積しやすい。<\/p><p class=\"ch\">（5）わが国ではじゃがいもの発芽防止に、ベータ線の照射が用いられている。<\/p>","choices":5,"answer":3},{"id":"37-056","exam":37,"num":56,"subject":3,"qhtml":"<p><b>56<\/b>　食品添加物に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）一日摂取許容量（ADI）は、厚生労働省が設定する。<\/p><p class=\"ch\">（2）無毒性量（NOAEL）は、ヒトに対する毒性試験の結果に基づいて設定される。<\/p><p class=\"ch\">（3）輸入した柑橘類をばら売りする場合、添加された防かび剤の表示は省略できる。<\/p><p class=\"ch\">（4）調味を目的に添加されたアミノ酸類は、一括名での表示が可能である。<\/p><p class=\"ch\">（5）着色料である赤色2号は、既存添加物に分類される。<\/p>","choices":5,"answer":4},{"id":"37-057","exam":37,"num":57,"subject":3,"qhtml":"<p><b>57<\/b>　食品表示基準に基づく一般用加工食品の表示に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）品質が急速に劣化しやすい食品には、賞味期限を表示しなければならない。<\/p><p class=\"ch\">（2）食物繊維量は、表示が推奨されている。<\/p><p class=\"ch\">（3）食塩相当量の表示値は、グルタミン酸ナトリウムに由来するナトリウムを含まない。<\/p><p class=\"ch\">（4）大麦を原材料に含む場合は、アレルゲンとしての表示が義務づけられている。<\/p><p class=\"ch\">（5）分別生産流通管理された遺伝子組換え農作物を主な原材料とする場合は、遺伝子組換え食品に関する表示を省略することができる。<\/p>","choices":5,"answer":2},{"id":"37-058","exam":37,"num":58,"subject":3,"qhtml":"<p><b>58<\/b>　栄養機能食品として表示が認められている栄養成分と栄養機能表示の組合せである。<\/p><p>誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）カリウム ――― 「正常な血圧を保つのに必要な栄養素です」<\/p><p class=\"ch\">（2）鉄 ――― 「赤血球を作るのに必要な栄養素です」<\/p><p class=\"ch\">（3）ビタミンB<sub>1<\/sub> ――― 「炭水化物からのエネルギー産生と皮膚や粘膜の健康維持を助ける栄養素です」<\/p><p class=\"ch\">（4）ビタミンD ――― 「骨粗鬆症になるリスクの低減を助ける栄養素です」<\/p><p class=\"ch\">（5）ビタミンK ――― 「正常な血液凝固能を維持する栄養素です」<\/p>","choices":5,"answer":4},{"id":"37-059","exam":37,"num":59,"subject":3,"qhtml":"<p><b>59<\/b>　特別用途食品および保健機能食品に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）特定保健用食品以外の特別用途食品には、許可証票（マーク）は定められていない。<\/p><p class=\"ch\">（2）特別用途食品（総合栄養食品）には、「食生活は、主食、主菜、副菜を基本に、食事のバランスを。」と表示しなくてはならない。<\/p><p class=\"ch\">（3）特定保健用食品（条件付き）は、規格基準を満たすことを条件として個別審査を経ることなく許可される。<\/p><p class=\"ch\">（4）機能性表示食品には、妊産婦を対象に開発された食品がある。<\/p><p class=\"ch\">（5）機能性表示食品は、安全性や機能性の根拠に関する情報を消費者庁のウェブサイトで確認することができる。<\/p>","choices":5,"answer":5},{"id":"37-060","exam":37,"num":60,"subject":3,"qhtml":"<p><b>60<\/b>　食品加工に利用される酵素とその利用に関する組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）パパイン ――― みかん缶詰製造における白濁原因物質の除去<\/p><p class=\"ch\">（2）キモシン ――― 味噌製造における大豆たんぱく質の分解<\/p><p class=\"ch\">（3）ペクチナーゼ ――― 転化糖製造におけるショ糖の分解<\/p><p class=\"ch\">（4）トランスグルタミナーゼ ――― かまぼこ製造におけるゲル形成の向上<\/p><p class=\"ch\">（5）グルコースイソメラーゼ ――― 柑橘果汁製造における苦味の除去<\/p>","choices":5,"answer":4},{"id":"37-061","exam":37,"num":61,"subject":3,"qhtml":"<p><b>61<\/b>　食品とその加工方法に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）うどんの製造に、かん水を使用する。<\/p><p class=\"ch\">（2）パンは、麹かびを利用して膨化させ製造する。<\/p><p class=\"ch\">（3）こんにゃくの製造に、水酸化カルシウムを使用する。<\/p><p class=\"ch\">（4）きなこは、豆乳を加熱して表面にできた膜を乾燥後に粉砕して製造する。<\/p><p class=\"ch\">（5）コーングリッツは、とうもろこしを湿式粉砕して製造する。<\/p>","choices":5,"answer":3},{"id":"37-062","exam":37,"num":62,"subject":3,"qhtml":"<p><b>62<\/b>　加工食品で利用されている多糖類とその原料に関する組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）アガロース ――― あまのり<\/p><p class=\"ch\">（2）アルギン酸 ――― 昆布<\/p><p class=\"ch\">（3）ペクチン ――― てんぐさ<\/p><p class=\"ch\">（4）カラギーナン ――― りんご<\/p><p class=\"ch\">（5）グルコマンナン ――― きく芋<\/p>","choices":5,"answer":2},{"id":"37-063","exam":37,"num":63,"subject":3,"qhtml":"<p><b>63<\/b>　食品の保存法と保存性を高めるための加工法に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）冷凍食品では、冷却時に-1～-5℃の温度帯を緩慢に通過させて-20℃にすることで品質が良好に保持される。<\/p><p class=\"ch\">（2）パーシャルフリージングでは、一般的にたんぱく質の変性が急速に進む。<\/p><p class=\"ch\">（3）ショ糖を用いる糖蔵では、浸透圧が低下する。<\/p><p class=\"ch\">（4）冷燻法による燻製食品は、熱燻法で製造された製品に比べて保存性が劣る。<\/p><p class=\"ch\">（5）容器包装に密封した常温流通食品のうち、pHが4.6を超え、かつ、水分活性が0.94 を超えるものは、120℃4分間以上の加熱により殺菌する。<\/p>","choices":5,"answer":5},{"id":"37-064","exam":37,"num":64,"subject":3,"qhtml":"<p><b>64<\/b>　食品の硬さを調整するための調理に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）じゃがいもは、軟らかくするために65℃に保ちながらゆでる。<\/p><p class=\"ch\">（2）さつまいもは、軟らかくするためにミョウバン入りの水でゆでる。<\/p><p class=\"ch\">（3）れんこんは、歯ごたえを良くするために重曹入りの水でゆでる。<\/p><p class=\"ch\">（4）だいこんの千切りは、歯ごたえを良くするために塩水に浸す。<\/p><p class=\"ch\">（5）鯉は、歯ごたえを良くするために、そぎ切りにして氷水に漬ける。<\/p>","choices":5,"answer":5},{"id":"37-065","exam":37,"num":65,"subject":3,"qhtml":"<p><b>65<\/b>　調理による食品の色の変化に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ほうれんそうは、短時間ゆでると黄褐色になる。<\/p><p class=\"ch\">（2）カリフラワーは、重曹とともにゆでると白色になる。<\/p><p class=\"ch\">（3）マッシュルームの切り口は、長時間放置すると黄色になる。<\/p><p class=\"ch\">（4）乾燥のりは、火であぶると赤色が濃くなる。<\/p><p class=\"ch\">（5）さばの普通筋は、酢じめすると白色になる。<\/p>","choices":5,"answer":5},{"id":"37-066","exam":37,"num":66,"subject":3,"qhtml":"<p><b>66<\/b>　食品の栄養成分と調理に関する記述である。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）野菜のカロテンは、油炒めにより消化管からの吸収が良くなる。<\/p><p class=\"ch\">（2）こまつなのカリウムは、ゆでることにより多くはゆで汁に溶出する。<\/p><p class=\"ch\">（3）さつまいものでんぷんは、65℃付近で加熱を続けると高分子化する。<\/p><p class=\"ch\">（4）牛乳のアミノ酸は、小麦粉生地の焼き過程で糖と結合する。<\/p><p class=\"ch\">（5）魚肉のたんぱく質は、食塩を加えてこねた後に加熱するとゲル化する。<\/p>","choices":5,"answer":3},{"id":"37-067","exam":37,"num":67,"subject":3,"qhtml":"<p><b>67<\/b>　表は、日本食品標準成分表2020年版（八訂）からの抜粋である。「ゆで」による重量変化率が150％のモロヘイヤについて、調理前の可食部重量が50gのとき、ゆでた後のビタミンC量（mg）として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）6<\/p><p class=\"ch\">（2）8<\/p><p class=\"ch\">（3）17<\/p><p class=\"ch\">（4）33<\/p><p class=\"ch\">（5）49<\/p><img class=\"fig\" src=\"img/q37_image3.jpg\" alt=\"図表\" data-zoom=\"img/q37_image3.jpg\">","choices":5,"answer":2},{"id":"37-068","exam":37,"num":68,"subject":4,"qhtml":"<p><b>68<\/b>　栄養学の歴史上の人物と、関連する事柄の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ルブネル(Rubner M) ――― 呼吸が燃焼と同じ現象であることを証明<\/p><p class=\"ch\">（2）クレブス(Krebs HA) ――― たんぱく質の窒素定量法を開発<\/p><p class=\"ch\">（3）ケルダール(Kjeldahl J) ――― 食事誘発性熱産生(DIT)を提唱<\/p><p class=\"ch\">（4）アトウォーター(Atwater WO) ――― 消化吸収率を考慮した栄養素の生理的熱量を提唱<\/p><p class=\"ch\">（5）ラボアジェ(Lavoisier AL) ――― クエン酸回路を発見<\/p>","choices":5,"answer":4},{"id":"37-069","exam":37,"num":69,"subject":4,"qhtml":"<p><b>69<\/b>　栄養素の吸収・移送の仕組みに関する組合せである。最も適当なのはどれか。1つ選べ。<\/p><p>栄養素　　微絨毛膜での吸収方式　　主な移送経路<\/p><p class=\"ch\">（1）グルコース ――― 促進拡散 ――― リンパ管<\/p><p class=\"ch\">（2）長鎖脂肪酸 ――― 促進拡散 ――― 門脈<\/p><p class=\"ch\">（3）コレステロール ――― 単純拡散 ――― 門脈<\/p><p class=\"ch\">（4）アミノ酸 ――― 能動輸送 ――― 門脈<\/p><p class=\"ch\">（5）ビタミンB<sub>12<\/sub> ――― 能動輸送 ――― リンパ管<\/p>","choices":5,"answer":4},{"id":"37-070","exam":37,"num":70,"subject":4,"qhtml":"<p><b>70<\/b>　たんぱく質の真の消化吸収率を求めるために出納試験を行い、以下の結果を得た。摂取窒素量10.0g/日、糞便中窒素量2.5g/日、尿中窒素量2.0g/日、無たんぱく質食摂取時の糞便中窒素量（糞便中内因性窒素量）1.0g/日。たんぱく質の真の消化吸収率（％）として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）55<\/p><p class=\"ch\">（2）65<\/p><p class=\"ch\">（3）75<\/p><p class=\"ch\">（4）85<\/p><p class=\"ch\">（5）95<\/p>","choices":5,"answer":4},{"id":"37-071","exam":37,"num":71,"subject":4,"qhtml":"<p><b>71<\/b>　食後の糖質代謝に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）脂肪組織へのグルコースの取り込みが亢進する。<\/p><p class=\"ch\">（2）肝臓グリコーゲンの分解が亢進する。<\/p><p class=\"ch\">（3）グルコース・アラニン回路によるグルコースの合成が亢進する。<\/p><p class=\"ch\">（4）脂肪酸からのグルコース合成が亢進する。<\/p><p class=\"ch\">（5）グルカゴンの分泌が亢進する。<\/p>","choices":5,"answer":1},{"id":"37-072","exam":37,"num":72,"subject":4,"qhtml":"<p><b>72<\/b>　難消化性の炭水化物の生理作用に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）キシリトールは、う蝕（虫歯）を予防する。<\/p><p class=\"ch\">（2）フラクトオリゴ糖は、食後の血糖値上昇を促進する。<\/p><p class=\"ch\">（3）グアーガム酵素分解物は、腸内のpHを上昇させる。<\/p><p class=\"ch\">（4）ポリデキストロースは、腸内有用菌の増殖を抑制する。<\/p><p class=\"ch\">（5）ラクツロースを過剰に摂取すると、便秘を引き起こす。<\/p>","choices":5,"answer":1},{"id":"37-073","exam":37,"num":73,"subject":4,"qhtml":"<p><b>73<\/b>　たんぱく質・アミノ酸の体内代謝に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）たんぱく質の摂取が不足すると、筋たんぱく質量が増加する。<\/p><p class=\"ch\">（2）たんぱく質の摂取が不足すると、急速代謝回転たんぱく質の血中濃度が上昇する。<\/p><p class=\"ch\">（3）たんぱく質の摂取が不足すると、ビタミンB<sub>6<\/sub>の必要量が増加する。<\/p><p class=\"ch\">（4）たんぱく質の過剰摂取時は、尿中への排泄窒素量が増加する。<\/p><p class=\"ch\">（5）たんぱく質の過剰摂取時は、窒素出納が負になる。<\/p>","choices":5,"answer":4},{"id":"37-074","exam":37,"num":74,"subject":4,"qhtml":"<p><b>74<\/b>　絶食時の脂質代謝に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）血中のキロミクロンが増加する。<\/p><p class=\"ch\">（2）脂肪組織では、ホルモン感受性リパーゼ活性が低下する。<\/p><p class=\"ch\">（3）血中の遊離脂肪酸が減少する。<\/p><p class=\"ch\">（4）筋肉では、エネルギー源としての脂肪酸の利用が抑制される。<\/p><p class=\"ch\">（5）血中のケトン体が増加する。<\/p>","choices":5,"answer":5},{"id":"37-075","exam":37,"num":75,"subject":4,"qhtml":"<p><b>75<\/b>　胆汁酸の代謝に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）胆汁酸は、コレステロールから合成される。<\/p><p class=\"ch\">（2）胆汁酸は、胆嚢で合成される。<\/p><p class=\"ch\">（3）腸管内に分泌された胆汁酸は、主に十二指腸で再吸収される。<\/p><p class=\"ch\">（4）腸内細菌の作用を受けて生成された胆汁酸を、一次胆汁酸という。<\/p><p class=\"ch\">（5）コール酸は、二次胆汁酸に分類される。<\/p>","choices":5,"answer":1},{"id":"37-076","exam":37,"num":76,"subject":4,"qhtml":"<p><b>76<\/b>　水溶性ビタミンと、それが関与する生体内代謝の組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ビタミンB<sub>1<\/sub> ――― アミノ基転移反応<\/p><p class=\"ch\">（2）ビタミンB<sub>2<\/sub> ――― 一炭素単位代謝<\/p><p class=\"ch\">（3）ナイアシン ――― 炭酸固定反応<\/p><p class=\"ch\">（4）パントテン酸 ――― 血液凝固因子合成<\/p><p class=\"ch\">（5）ビタミンC ――― コラーゲン合成<\/p>","choices":5,"answer":5},{"id":"37-077","exam":37,"num":77,"subject":4,"qhtml":"<p><b>77<\/b>　ビタミンの消化・吸収および代謝に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ビタミンAは、脂質と一緒に摂取すると吸収率が低下する。<\/p><p class=\"ch\">（2）ビタミンKは、腸内細菌により合成される。<\/p><p class=\"ch\">（3）ビタミンB<sub>1<\/sub>は、組織飽和量に達すると尿中排泄量が減少する。<\/p><p class=\"ch\">（4）吸収されたビタミンB<sub>2<\/sub>は、キロミクロンに取り込まれる。<\/p><p class=\"ch\">（5）ビタミンB<sub>6<\/sub>の吸収には、内因子が必要である。<\/p>","choices":5,"answer":2},{"id":"37-078","exam":37,"num":78,"subject":4,"qhtml":"<p><b>78<\/b>　鉄代謝と栄養に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ヘム鉄は、植物性食品に含まれる。<\/p><p class=\"ch\">（2）非ヘム鉄は、二価鉄に還元されて吸収される。<\/p><p class=\"ch\">（3）体内総鉄量に占める機能鉄の割合は、貯蔵鉄より低い。<\/p><p class=\"ch\">（4）鉄は、主にトランスフェリンと結合して貯蔵される。<\/p><p class=\"ch\">（5）鉄欠乏では、血中ヘモグロビン値が血中フェリチン値より先に低下する。<\/p>","choices":5,"answer":2},{"id":"37-079","exam":37,"num":79,"subject":4,"qhtml":"<p><b>79<\/b>　水と電解質に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）代謝水は、栄養素の代謝により失われる水である。<\/p><p class=\"ch\">（2）不感蒸泄は、発汗により失われる水である。<\/p><p class=\"ch\">（3）不可避水分摂取量は、不可避尿量と等しい。<\/p><p class=\"ch\">（4）低張性脱水では、細胞外液から細胞内液へ水が移動する。<\/p><p class=\"ch\">（5）細胞内液では、カリウムイオン濃度よりナトリウムイオン濃度が高い。<\/p>","choices":5,"answer":4},{"id":"37-080","exam":37,"num":80,"subject":4,"qhtml":"<p><b>80<\/b>　基礎代謝量に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）同じ体重の場合、体脂肪量が多いほど高くなる。<\/p><p class=\"ch\">（2）体表面積が大きいほど低くなる。<\/p><p class=\"ch\">（3）体重当たりの基礎代謝量は、加齢とともに高くなる。<\/p><p class=\"ch\">（4）発熱に伴い低くなる。<\/p><p class=\"ch\">（5）低栄養状態で低くなる。<\/p>","choices":5,"answer":5},{"id":"37-081","exam":37,"num":81,"subject":4,"qhtml":"<p><b>81<\/b>　非たんぱく質呼吸商を求めるために呼気分析を行い、以下の結果を得た。酸素消費量A(L:リットル)、二酸化炭素排出量B(L)、たんぱく質の燃焼による酸素消費量C(L)、たんぱく質の燃焼による二酸化炭素排出量D(L)。非たんぱく質呼吸商を求めるための計算式として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）B/A<\/p><p class=\"ch\">（2）(B-D)/(A-C)<\/p><p class=\"ch\">（3）(B+D)/(A+C)<\/p><p class=\"ch\">（4）(A-C)/(B-D)<\/p><p class=\"ch\">（5）(A+C)/(B+D)<\/p>","choices":5,"answer":2},{"id":"37-082","exam":37,"num":82,"subject":5,"qhtml":"<p><b>82<\/b>　栄養ケア・マネジメントの基本的構造である(図)。a～cに入る用語の組合せとして、最も適当なのはどれか。1つ選べ。<\/p><p>a 　　　　　　　 b 　　　　　　　　 c<\/p><p class=\"ch\">（1）モニタリング ――― 実施・チェック ――― 評価<\/p><p class=\"ch\">（2）モニタリング ――― 評価 ――― 実施・チェック<\/p><p class=\"ch\">（3）評価 ――― 実施・チェック ――― モニタリング<\/p><p class=\"ch\">（4）実施・チェック ――― 評価 ――― モニタリング<\/p><p class=\"ch\">（5）実施・チェック ――― モニタリング ――― 評価<\/p><img class=\"fig\" src=\"img/q37_image4.jpg\" alt=\"図表\" data-zoom=\"img/q37_image4.jpg\">","choices":5,"answer":5},{"id":"37-083","exam":37,"num":83,"subject":5,"qhtml":"<p><b>83<\/b>　栄養スクリーニングに関する記述である。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）低コストの方法を用いる。<\/p><p class=\"ch\">（2）侵襲性が低い方法を用いる。<\/p><p class=\"ch\">（3）敏感度が高い方法を用いる。<\/p><p class=\"ch\">（4）SGAでは、採血が必要である。<\/p><p class=\"ch\">（5）簡易栄養状態評価表(MNA<sup>®<\/sup>)は、体重変化を含む。<\/p>","choices":5,"answer":4},{"id":"37-084","exam":37,"num":84,"subject":5,"qhtml":"<p><b>84<\/b>　日本人の食事摂取基準(2020年版)の栄養素の指標に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）EARは、AIを基に算定する。<\/p><p class=\"ch\">（2）RDAは、動物実験の結果を根拠に算定する。<\/p><p class=\"ch\">（3）AIは、症例報告を根拠に算定する。<\/p><p class=\"ch\">（4）ULは、サプリメント由来の栄養素を対象としない。<\/p><p class=\"ch\">（5）DGは、生活習慣病の発症予防を目的としている。<\/p>","choices":5,"answer":5},{"id":"37-085","exam":37,"num":85,"subject":5,"qhtml":"<p><b>85<\/b>　日本人の食事摂取基準(2020年版)において、集団内の半数の者に不足または欠乏の症状が現れうる摂取量をEARの算定根拠とした栄養素である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）たんぱく質<\/p><p class=\"ch\">（2）ビタミンB<sub>2<\/sub><\/p><p class=\"ch\">（3）ナイアシン<\/p><p class=\"ch\">（4）カルシウム<\/p><p class=\"ch\">（5）鉄<\/p>","choices":5,"answer":3},{"id":"37-086","exam":37,"num":86,"subject":5,"qhtml":"<p><b>86<\/b>　成長による身体的変化に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）身長は、幼児期に発育急進期がある。<\/p><p class=\"ch\">（2）脳重量は、6歳頃に成人の90％以上になる。<\/p><p class=\"ch\">（3）肺重量は、12歳頃に成人のレベルになる。<\/p><p class=\"ch\">（4）胸腺重量は、思春期以後に増大する。<\/p><p class=\"ch\">（5）子宮重量は、10歳頃に成人のレベルになる。<\/p>","choices":5,"answer":2},{"id":"37-087","exam":37,"num":87,"subject":5,"qhtml":"<p><b>87<\/b>　単位重量当たりで、成乳(成熟乳)に比べ初乳に多く含まれる母乳成分である。<\/p><p>誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ラクトフェリン<\/p><p class=\"ch\">（2）IgA<\/p><p class=\"ch\">（3）リゾチーム<\/p><p class=\"ch\">（4）ラクトース<\/p><p class=\"ch\">（5）ビタミンA<\/p>","choices":5,"answer":4},{"id":"37-088","exam":37,"num":88,"subject":5,"qhtml":"<p><b>88<\/b>　日本人の食事摂取基準(2020年版)において、要因加算法によって求めた妊娠中期における鉄のEAR・RDAの付加量である(表)。このときに前提とした吸収率(％)として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）3<\/p><p class=\"ch\">（2）15<\/p><p class=\"ch\">（3）34<\/p><p class=\"ch\">（4）40<\/p><p class=\"ch\">（5）84<\/p><img class=\"fig\" src=\"img/q37_image5.jpg\" alt=\"図表\" data-zoom=\"img/q37_image5.jpg\">","choices":5,"answer":4},{"id":"37-089","exam":37,"num":89,"subject":5,"qhtml":"<p><b>89<\/b>　出生による胎児循環から新生児循環への変化に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）肺胞は、縮小する。<\/p><p class=\"ch\">（2）肺静脈は、萎縮する。<\/p><p class=\"ch\">（3）動脈管は、拡張する。<\/p><p class=\"ch\">（4）左心房内圧は、低下する。<\/p><p class=\"ch\">（5）卵円孔は、閉鎖する。<\/p>","choices":5,"answer":5},{"id":"37-090","exam":37,"num":90,"subject":5,"qhtml":"<p><b>90<\/b>　幼児期・学童期のやせと肥満に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）幼児期の肥満は、二次性肥満が多い。<\/p><p class=\"ch\">（2）幼児期の肥満では、厳しいエネルギー制限を行う。<\/p><p class=\"ch\">（3）小児メタボリックシンドロームの診断基準では、腹囲の基準が男女で異なる。<\/p><p class=\"ch\">（4）学童期では、肥満度-20％以下を痩身傾向児と判定する。<\/p><p class=\"ch\">（5）学童期には、内臓脂肪の蓄積は見られない。<\/p>","choices":5,"answer":4},{"id":"37-091","exam":37,"num":91,"subject":5,"qhtml":"<p><b>91<\/b>　更年期の生理的変化に関する記述である。減少または低下するものとして、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）性腺刺激ホルモン放出ホルモンの分泌量<\/p><p class=\"ch\">（2）プロゲステロンの分泌量<\/p><p class=\"ch\">（3）卵胞刺激ホルモン(FSH)の分泌量<\/p><p class=\"ch\">（4）黄体形成ホルモン(LH)の分泌量<\/p><p class=\"ch\">（5）血中LDLコレステロール値<\/p>","choices":5,"answer":2},{"id":"37-092","exam":37,"num":92,"subject":5,"qhtml":"<p><b>92<\/b>　日本人の食事摂取基準(2020年版)において、生活習慣病の重症化予防を目的とした摂取量を設定した栄養素である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）たんぱく質<\/p><p class=\"ch\">（2）飽和脂肪酸<\/p><p class=\"ch\">（3）コレステロール<\/p><p class=\"ch\">（4）食物繊維<\/p><p class=\"ch\">（5）カリウム<\/p>","choices":5,"answer":3},{"id":"37-093","exam":37,"num":93,"subject":5,"qhtml":"<p><b>93<\/b>　成人期と比較した高齢期の身体的・生理的変化に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）除脂肪量は、増加する。<\/p><p class=\"ch\">（2）筋たんぱく質の同化作用は、減弱する。<\/p><p class=\"ch\">（3）肺活量は、増加する。<\/p><p class=\"ch\">（4）唾液分泌量は、増加する。<\/p><p class=\"ch\">（5）インスリン抵抗性は、減弱する。<\/p>","choices":5,"answer":2},{"id":"37-094","exam":37,"num":94,"subject":5,"qhtml":"<p><b>94<\/b>　老年症候群にみられる症候と、その評価法の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）嚥下機能障害 ――― BI(Barthel Index)<\/p><p class=\"ch\">（2）うつ ――― DESIGN-R<sup>®<\/sup><\/p><p class=\"ch\">（3）褥瘡 ――― FIM<\/p><p class=\"ch\">（4）転倒 ――― RSST<\/p><p class=\"ch\">（5）認知機能障害 ――― MMSE<\/p>","choices":5,"answer":5},{"id":"37-095","exam":37,"num":95,"subject":5,"qhtml":"<p><b>95<\/b>　身体活動時における骨格筋のエネルギー供給に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）クレアチンリン酸の分解によるエネルギー供給は、酸素を必要とする。<\/p><p class=\"ch\">（2）筋グリコーゲンは、グルコースに変換されて、血中に放出される。<\/p><p class=\"ch\">（3）高強度(最大酸素摂取量の85％以上)の運動では、糖質が主なエネルギー供給源になる。<\/p><p class=\"ch\">（4）脂質のみが燃焼した時の呼吸商は、1.0である。<\/p><p class=\"ch\">（5）無酸素運動では、筋肉中の乳酸が減少する。<\/p>","choices":5,"answer":3},{"id":"37-096","exam":37,"num":96,"subject":5,"qhtml":"<p><b>96<\/b>　ストレス応答の抵抗期に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）エネルギー代謝は、低下する。<\/p><p class=\"ch\">（2）窒素出納は、正に傾く。<\/p><p class=\"ch\">（3）糖新生は、亢進する。<\/p><p class=\"ch\">（4）脂肪分解量は、減少する。<\/p><p class=\"ch\">（5）尿中カルシウム排泄量は、減少する。<\/p>","choices":5,"answer":3},{"id":"37-097","exam":37,"num":97,"subject":5,"qhtml":"<p><b>97<\/b>　特殊環境における生体反応に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）低温環境では、熱産生が低下する。<\/p><p class=\"ch\">（2）高温環境では、アルドステロン分泌量が減少する。<\/p><p class=\"ch\">（3）低圧環境では、食欲が亢進する。<\/p><p class=\"ch\">（4）高圧環境では、肺胞内の酸素分圧が低下する。<\/p><p class=\"ch\">（5）無重力環境では、骨吸収が亢進する。<\/p>","choices":5,"answer":5},{"id":"37-098","exam":37,"num":98,"subject":6,"qhtml":"<p><b>98<\/b>　高血圧対策として、社員の食塩摂取量の減少を目指した取組を行うことになった。社会的認知理論の構成概念と、それを活用した取組の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）結果期待 ――― 社員食堂の定食を、全て減塩メニューに変更する。<\/p><p class=\"ch\">（2）観察学習 ――― 減塩によるメリットを、社員食堂の卓上メモで周知する。<\/p><p class=\"ch\">（3）自己制御 ――― 減塩によって高血圧が改善した社員の体験談を、社内ウェブサイトに掲載する。<\/p><p class=\"ch\">（4）自己効力感 ――― 減塩醤油の試供品を配布し、家庭で使ってもらう。<\/p><p class=\"ch\">（5）観察学習 ――― 血圧の記録表を、社員全員に配布する。<\/p>","choices":5,"answer":4},{"id":"37-099","exam":37,"num":99,"subject":6,"qhtml":"<p><b>99<\/b>　特定保健指導で、野菜摂取量を増やすという行動目標を立てた単身赴任男性である。この男性に対し、家族が行うソーシャルサポートの内容とサポートの種類の組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）冷凍のヘルシー弁当を手配する。 ――― 情報的サポート<\/p><p class=\"ch\">（2）男性向けの野菜料理の本を購入して渡す。 ――― 情報的サポート<\/p><p class=\"ch\">（3）市販の惣菜をアレンジして野菜を増やす方法を教える。 ――― 評価的サポート<\/p><p class=\"ch\">（4）毎月、野菜を使った常備菜を作りに行く。 ――― 情動的サポート<\/p><p class=\"ch\">（5）毎週、励ましのメールを送る。 ――― 道具的サポート<\/p>","choices":5,"answer":2},{"id":"37-100","exam":37,"num":100,"subject":6,"qhtml":"<p><b>100<\/b>　企業の管理栄養士が、中高年向けの新しい食事管理アプリを開発し、販売することになった。イノベーション普及理論の観察可能性(可観測性)に当たる内容として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）従来の食事管理アプリより、利用料金が安い。<\/p><p class=\"ch\">（2）食事管理アプリの試用体験会を実施する。<\/p><p class=\"ch\">（3）毎日の食事内容の入力が簡単である。<\/p><p class=\"ch\">（4）画面の文字が大きく、見やすい。<\/p><p class=\"ch\">（5）スマートフォンで利用でき、仲間に見せられる。<\/p>","choices":5,"answer":5},{"id":"37-101","exam":37,"num":101,"subject":6,"qhtml":"<p><b>101<\/b>　「減量のために間食を控えたいと思っていますが、介護によるストレスのせいか、なかなかやめられません。でも、なんとか間食をやめたいんです。」と話す肥満の中年女性への栄養カウンセリングである。クライアントの訴えたい内容を受け止めて、受容的態度を示す管理栄養士の発言として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）そんなに深刻にならなくても、大丈夫ですよ。<\/p><p class=\"ch\">（2）介護のストレスが、とても大変なんですね。<\/p><p class=\"ch\">（3）なんとか間食を控えて減量したいと、思っていらっしゃるのですね。<\/p><p class=\"ch\">（4）そういうことはありますよね。<\/p>","choices":4,"answer":3},{"id":"37-102","exam":37,"num":102,"subject":6,"qhtml":"<p><b>102<\/b>　営業職の男性に対する栄養カウンセリングである。動機づけ面接のチェンジトークに該当する男性の発言として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）仕事が忙しくて、食生活を改善できる気がしません。<\/p><p class=\"ch\">（2）仕事帰りに、居酒屋に寄ることが唯一の楽しみなんです。<\/p><p class=\"ch\">（3）仕事で、食事が不規則になるのは仕方ないですよね。<\/p><p class=\"ch\">（4）忙しい中でも、できることを考えてみると良いのですよね。<\/p><p class=\"ch\">（5）家族のためにも、今は仕事を頑張ろうと思っています。<\/p>","choices":5,"answer":4},{"id":"37-103","exam":37,"num":103,"subject":6,"qhtml":"<p><b>103<\/b>　飲酒量を減らすことを目的とした、中年男性への栄養教育である。支援内容と行動変容技法の組合せとして、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）会社の飲み会で、飲酒量が多い人の隣には――― ソーシャルスキルトレーニング<\/p><p>座らないように提案する。<\/p><p class=\"ch\">（2）お酒を飲みたくなったら、喉が渇いているだけだと――― 自己強化<\/p><p>自分に言い聞かせることを提案する。<\/p><p class=\"ch\">（3）お酒を飲みに行く以外に、同僚とのコミュニケーション――― 結果期待<\/p><p>を図る方法を考えてもらう。<\/p><p class=\"ch\">（4）週1回の休肝日にお酒を飲んだら、次の休肝日まで趣味の――― オペラント強化<\/p><p>オンラインゲームをやらないことを提案する。<\/p><p class=\"ch\">（5）お酒を飲まないデメリットと、お酒を飲む――― ストレスマネジメント<\/p><p>デメリットを比べてもらう。<\/p>","choices":5,"answer":4},{"id":"37-104","exam":37,"num":104,"subject":6,"qhtml":"<p><b>104<\/b>　減量を目的とした支援内容である。ナッジの考え方を活用した支援として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）減量することのメリットを考えてもらう。<\/p><p class=\"ch\">（2）減量に成功したときのご褒美を考えてもらう。<\/p><p class=\"ch\">（3）食べたものを記録してもらう。<\/p><p class=\"ch\">（4）ご飯茶碗を小さくすることを勧める。<\/p><p class=\"ch\">（5）栄養成分表示を見て、食品を選ぶように勧める。<\/p>","choices":5,"answer":4},{"id":"37-105","exam":37,"num":105,"subject":6,"qhtml":"<p><b>105<\/b>　K市の介護予防教室を修了した高齢者が、定期的に体操を行うセルフヘルプグループを立ち上げた。その組織活動を発展させていくために市の管理栄養士が行った活動である。組織をエンパワメントする支援として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）他地域で同様の活動を行う組織の様子を紹介し、自分たちの特徴と課題を考えるように促した。<\/p><p class=\"ch\">（2）市民の集まる場で、体操の様子を披露する機会を作り、発表してもらった。<\/p><p class=\"ch\">（3）次年度の活動を考える会議で、話し合いの進行役を担った。<\/p><p class=\"ch\">（4）体操に加え、食生活に関する活動を進めてもらうために、情報提供を行った。<\/p>","choices":4,"answer":2},{"id":"37-106","exam":37,"num":106,"subject":6,"qhtml":"<p><b>106<\/b>　小学生の野菜嫌いを改善するための取組を行うことになり、プリシード・プロシードモデルに基づくアセスメントを行った。準備要因のアセスメント項目として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）野菜に興味を示す児童の割合<\/p><p class=\"ch\">（2）野菜に触れる授業の回数<\/p><p class=\"ch\">（3）便秘気味の児童の割合<\/p><p class=\"ch\">（4）家庭で野菜料理を意識して食べさせている保護者の割合<\/p><p class=\"ch\">（5）農業体験ができる地域の農園の数<\/p>","choices":5,"answer":1},{"id":"37-107","exam":37,"num":107,"subject":6,"qhtml":"<p><b>107<\/b>　K大学で在学生を対象に調査をしたところ、体調不良と朝食内容に関連が見つかった。大学として「朝ごはん教室」を開催することとなり、目標を設定した。実施目標の項目として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）体調不良が改善した学生を、50％以上にする。<\/p><p class=\"ch\">（2）主食・主菜・副菜を組み合わせた朝食を週2回以上食べる学生を、70％以上にする。<\/p><p class=\"ch\">（3）学生食堂に対し、朝食の提供日数を週4日に増やすよう働きかける。<\/p><p class=\"ch\">（4）次回の教室にも参加したいと思う学生を、80％以上にする。<\/p><p class=\"ch\">（5）栄養バランスの良い朝食の必要性を説明できる学生を、80％以上にする。<\/p>","choices":5,"answer":4},{"id":"37-108","exam":37,"num":108,"subject":6,"qhtml":"<p><b>108<\/b>　1年生のクラスが3つある小学校において、栄養教諭が、1年生の給食開始に合わせて、食器の並べ方の給食指導を行うことになった。教材とその活用方法として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）説明用のプリントを、給食開始の1週間前に配布し、家で読んでくるように伝える。<\/p><p class=\"ch\">（2）上級生が食器の並べ方を説明している動画を、1週間毎日、配膳前に視聴させる。<\/p><p class=\"ch\">（3）見本となる食器の並べ方の絵を、1週間毎日、配膳前に黒板に掲示する。<\/p><p class=\"ch\">（4）食器の実物を持って、1週間毎日、配膳時にクラスを回り、食器の並べ方を個別に伝える。<\/p>","choices":4,"answer":2},{"id":"37-109","exam":37,"num":109,"subject":6,"qhtml":"<p><b>109<\/b>　K市保健センターの管理栄養士である。生後4,5か月児を持つ保護者を対象に、離乳食作りの不安を軽減するための教室を開催した。教室の評価と、評価の種類の組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）関係部署との連携により、予算内で実施することができた。 ――― 経過評価<\/p><p class=\"ch\">（2）離乳食作りに必要な器具を揃え始めた保護者が増加した。 ――― 結果評価<\/p><p class=\"ch\">（3）離乳食で困った時に相談できる場所を知っている保護者が増加した。 ――― 影響評価<\/p><p class=\"ch\">（4）育児不安を感じる保護者が減少した。 ――― 形成的評価<\/p><p class=\"ch\">（5）教室参加者の80％が満足と回答した。 ――― 企画評価<\/p>","choices":5,"answer":3},{"id":"37-110","exam":37,"num":110,"subject":6,"qhtml":"<p><b>110<\/b>　体重増加を目指す大学ラグビー部の学生12人を対象に、栄養教室を3か月で計6回実施した。教室の総費用は60,000円であった。参加者の体重増加量の合計は10kgであった。体重1kg当たりの教室の費用効果(円)として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）1,000<\/p><p class=\"ch\">（2）5,000<\/p><p class=\"ch\">（3）6,000<\/p><p class=\"ch\">（4）10,000<\/p><p class=\"ch\">（5）20,000<\/p>","choices":5,"answer":3},{"id":"37-111","exam":37,"num":111,"subject":7,"qhtml":"<p><b>111<\/b>　K病院に勤務する管理栄養士である。急性期病棟に入院している患者に対して、入院栄養食事指導料を算定し、退院後の栄養・食事管理について指導するとともに、入院中の栄養管理に関する情報を示す文書を用いて患者に説明し、これを転院先のリハビリテーション病院の管理栄養士と共有した。入院栄養食事指導料に加えて、診療報酬・介護報酬により算定できるものである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）回復期リハビリテーション病棟入院料1<\/p><p class=\"ch\">（2）栄養マネジメント強化加算<\/p><p class=\"ch\">（3）退院時共同指導料1<\/p><p class=\"ch\">（4）退院時共同指導料2<\/p><p class=\"ch\">（5）栄養情報提供加算<\/p>","choices":5,"answer":5},{"id":"37-112","exam":37,"num":112,"subject":7,"qhtml":"<p><b>112<\/b>　身長150cm、体重40kg、標準体重50kgの女性患者。1日尿中クレアチニン排泄量が750mgのときのクレアチニン身長係数(％)である。ただし、クレアチニン係数は、18mg/kg標準体重とする。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）120<\/p><p class=\"ch\">（2）104<\/p><p class=\"ch\">（3）96<\/p><p class=\"ch\">（4）83<\/p><p class=\"ch\">（5）42<\/p>","choices":5,"answer":4},{"id":"37-113","exam":37,"num":113,"subject":7,"qhtml":"<p><b>113<\/b>　空腸瘻にて1.0kcal/mLの成分栄養剤(常温)を100mL/時で300mL投与したところ、下痢を生じた。その対策に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）成分栄養剤の濃度を、2.0kcal/mLに変更する。<\/p><p class=\"ch\">（2）成分栄養剤を、脂肪含量の多い経腸栄養剤に変更する。<\/p><p class=\"ch\">（3）成分栄養剤の温度を、4℃にして投与する。<\/p><p class=\"ch\">（4）成分栄養剤の投与速度を、20mL/時に変更する。<\/p><p class=\"ch\">（5）成分栄養剤を、1時間で300mL投与する。<\/p>","choices":5,"answer":4},{"id":"37-114","exam":37,"num":114,"subject":7,"qhtml":"<p><b>114<\/b>　中心静脈栄養において、25％ブドウ糖基本輸液1,000mL(1,000kcal)、総合アミノ酸製剤600mL(400kcal、窒素量9g)、20％脂肪乳剤100mL(200kcal)を投与した。この時のNPC/N比である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）67<\/p><p class=\"ch\">（2）110<\/p><p class=\"ch\">（3）133<\/p><p class=\"ch\">（4）155<\/p><p class=\"ch\">（5）178<\/p>","choices":5,"answer":3},{"id":"37-115","exam":37,"num":115,"subject":7,"qhtml":"<p><b>115<\/b>　医薬品が電解質に及ぼす影響の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）サイアザイド系利尿薬 ――― 尿中ナトリウム排泄抑制<\/p><p class=\"ch\">（2）ループ利尿薬 ――― 尿中カリウム排泄抑制<\/p><p class=\"ch\">（3）アンジオテンシン変換酵素阻害薬 ――― 血清カリウム値低下<\/p><p class=\"ch\">（4）甘草湯 ――― 血清カリウム値上昇<\/p><p class=\"ch\">（5）ステロイド内服薬(コルチゾール) ――― 血清カリウム値低下<\/p>","choices":5,"answer":5},{"id":"37-116","exam":37,"num":116,"subject":7,"qhtml":"<p><b>116<\/b>　BMI 17.5kg/m<sup>2<\/sup>の患者。むせるので食事はつらいとのことで、嚥下障害による経口摂取量の不足と評価した。嚥下調整食について本人と家族に指導し、むせの状態や食事摂取量、体重の経過を観察することとした。この症例におけるSOAPとその内容の組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）S ――― BMI 17.5kg/m<sup>2<\/sup><\/p><p class=\"ch\">（2）O ――― 嚥下障害による経口摂取量の不足と評価した。<\/p><p class=\"ch\">（3）A ――― むせるので食事はつらい。<\/p><p class=\"ch\">（4）P(治療計画) ――― むせの状態や食事摂取量、体重の経過を観察する。<\/p><p class=\"ch\">（5）P(教育計画) ――― 嚥下調整食について本人と家族に指導する。<\/p>","choices":5,"answer":5},{"id":"37-117","exam":37,"num":117,"subject":7,"qhtml":"<p><b>117<\/b>　たんぱく質・エネルギー栄養障害患者に対し、栄養療法を開始したところ、リフィーディング症候群を呈した。その際の病態に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）血清カリウム値は、上昇している。<\/p><p class=\"ch\">（2）血清リン値は、低下している。<\/p><p class=\"ch\">（3）血清マグネシウム値は、上昇している。<\/p><p class=\"ch\">（4）血清ビタミンB<sub>1<\/sub>値は、上昇している。<\/p><p class=\"ch\">（5）血清インスリン値は、低下している。<\/p>","choices":5,"answer":2},{"id":"37-118","exam":37,"num":118,"subject":7,"qhtml":"<p><b>118<\/b>　50歳、男性。事務職。身長181cm、体重90kg、BMI 27.5kg/m<sup>2<\/sup>、標準体重72kg。血圧145/90mmHg。他に異常は認められなかった。この患者に初めて外来栄養食事指導を行うことになった。1日当たりの目標栄養量の組合せである。ただし、食塩は6g/日未満とする。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p>エネルギー(kcal/日) 　 たんぱく質(g/日) 　　 脂肪(g/日)<\/p><p class=\"ch\">（1）600 ――――――――― 40 ――――――――― 20<\/p><p class=\"ch\">（2）600 ――――――――― 80 ――――――――― 15<\/p><p class=\"ch\">（3）1,800 ―――――――― 40 ――――――――― 60<\/p><p class=\"ch\">（4）1,800 ―――――――― 80 ――――――――― 50<\/p><p class=\"ch\">（5）1,800 ―――――――― 80 ――――――――― 15<\/p>","choices":5,"answer":4},{"id":"37-119","exam":37,"num":119,"subject":7,"qhtml":"<p><b>119<\/b>　糖尿病治療薬の主作用に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）SGLT2阻害薬は、腎臓でのグルコースの再吸収を促進する。<\/p><p class=\"ch\">（2）チアゾリジン薬は、インスリン抵抗性を改善する。<\/p><p class=\"ch\">（3）ビグアナイド薬は、インスリン分泌を促進する。<\/p><p class=\"ch\">（4）GLP-1受容体作動薬は、インクレチン分解を促進する。<\/p><p class=\"ch\">（5）スルホニル尿素(SU)薬は、腸管でのグルコースの吸収を抑制する。<\/p>","choices":5,"answer":2},{"id":"37-120","exam":37,"num":120,"subject":7,"qhtml":"<p><b>120<\/b>　50歳男性。事務職。標準体重60kgの高LDLコレステロール血症の患者である。初回の外来栄養食事指導の翌月、2回目の指導の前に1日当たりの摂取量の評価を行った。改善が必要な項目として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）エネルギー 1,600kcal<\/p><p class=\"ch\">（2）たんぱく質 80g<\/p><p class=\"ch\">（3）飽和脂肪酸 8g<\/p><p class=\"ch\">（4）コレステロール 150mg<\/p><p class=\"ch\">（5）食物繊維 10g<\/p>","choices":5,"answer":5},{"id":"37-121","exam":37,"num":121,"subject":7,"qhtml":"<p><b>121<\/b>　高尿酸血症患者に対して、アルコールの摂取制限が指示される。これは、アルコールが代謝される際に、(a)の分解が進み尿酸の産生が増えることと、(b)が産生されることで尿酸の排泄が低下するためである。aとbに入る物質名の組合せとして、最も適当なのはどれか。1つ選べ。<\/p><p>a 　　　　　 b<\/p><p class=\"ch\">（1）乳酸 ――― アセチルCoA<\/p><p class=\"ch\">（2）脂肪酸 ――― ATP<\/p><p class=\"ch\">（3）アンモニア ――― NADH<\/p><p class=\"ch\">（4）NADH ――― 脂肪酸<\/p><p class=\"ch\">（5）ATP ――― 乳酸<\/p>","choices":5,"answer":5},{"id":"37-122","exam":37,"num":122,"subject":7,"qhtml":"<p><b>122<\/b>　消化器疾患の栄養管理に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）胃食道逆流症では、高脂肪食とする。<\/p><p class=\"ch\">（2）短腸症候群では、脂肪を制限する。<\/p><p class=\"ch\">（3）潰瘍性大腸炎寛解期では、たんぱく質を制限する。<\/p><p class=\"ch\">（4）偽膜性腸炎では、水分を制限する。<\/p><p class=\"ch\">（5）回腸ストマ(人工肛門)の管理では、水分を制限する。<\/p>","choices":5,"answer":2},{"id":"37-123","exam":37,"num":123,"subject":7,"qhtml":"<p><b>123<\/b>　53歳、男性。標準体重64kgの肝硬変患者。血清アルブミン値2.2g/dL、血清フェリチン値200ng/mL(基準値15～160ng/mL)、腹水・浮腫あり、肝性脳症が認められる。この患者に肝不全用経腸栄養剤630kcalを投与した際の、食事から摂取する1日当たりの目標栄養量に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）エネルギーは、600kcalとする。<\/p><p class=\"ch\">（2）たんぱく質は、40gとする。<\/p><p class=\"ch\">（3）食塩は、8gとする。<\/p><p class=\"ch\">（4）鉄は、12mg以上とする。<\/p><p class=\"ch\">（5）食物繊維は、10g以下とする。<\/p>","choices":5,"answer":2},{"id":"37-124","exam":37,"num":124,"subject":7,"qhtml":"<p><b>124<\/b>　慢性膵炎の病態と栄養管理に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）代償期の間欠期では、たんぱく質摂取量を0.8g/kg標準体重/日とする。<\/p><p class=\"ch\">（2）代償期の再燃時では、血清アミラーゼ値が低下する。<\/p><p class=\"ch\">（3）非代償期では、腹痛が増強する。<\/p><p class=\"ch\">（4）非代償期では、インスリン分泌が低下する。<\/p><p class=\"ch\">（5）非代償期では、脂肪摂取量を10g/日とする。<\/p>","choices":5,"answer":4},{"id":"37-125","exam":37,"num":125,"subject":7,"qhtml":"<p><b>125<\/b>　高血圧患者の食塩摂取量を推定するために、24時間蓄尿を行ったところ、尿量が1.2L、尿中ナトリウム濃度が170mEq/Lであった。尿中食塩排泄量(g/日)として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）8<\/p><p class=\"ch\">（2）10<\/p><p class=\"ch\">（3）12<\/p><p class=\"ch\">（4）14<\/p><p class=\"ch\">（5）16<\/p>","choices":5,"answer":3},{"id":"37-126","exam":37,"num":126,"subject":7,"qhtml":"<p><b>126<\/b>　55歳、女性。標準体重55kgのCKD患者。eGFR40mL/分/1.73m<sup>2<\/sup>。この患者の1日当たりの目標栄養量の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p>エネルギー(kcal/日) 　　　たんぱく質(g/日)<\/p><p class=\"ch\">（1）1,700 ―――――――――――― 30<\/p><p class=\"ch\">（2）1,700 ―――――――――――― 40<\/p><p class=\"ch\">（3）2,100 ―――――――――――― 30<\/p><p class=\"ch\">（4）2,100 ―――――――――――― 40<\/p><p class=\"ch\">（5）2,400 ―――――――――――― 40<\/p>","choices":5,"answer":2},{"id":"37-127","exam":37,"num":127,"subject":7,"qhtml":"<p><b>127<\/b>　血液透析患者の1日当たりの目標栄養量である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）エネルギーは、25kcal/kg標準体重とする。<\/p><p class=\"ch\">（2）たんぱく質は、1.5g/kg標準体重とする。<\/p><p class=\"ch\">（3）カリウムは、3,000mgとする。<\/p><p class=\"ch\">（4）リンは、たんぱく質量(g)×15mgとする。<\/p><p class=\"ch\">（5）飲水量は、2,000mLとする。<\/p>","choices":5,"answer":4},{"id":"37-128","exam":37,"num":128,"subject":7,"qhtml":"<p><b>128<\/b>　パーキンソン病治療薬レボドパ(L-ドーパ)の吸収に影響することから、昼食として摂取を控えるのが望ましい食事である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ジャムサンド<\/p><p class=\"ch\">（2）シーフードドリア<\/p><p class=\"ch\">（3）ざるそば<\/p><p class=\"ch\">（4）わかめうどん<\/p><p class=\"ch\">（5）梅粥<\/p>","choices":5,"answer":2},{"id":"37-129","exam":37,"num":129,"subject":7,"qhtml":"<p><b>129<\/b>　25歳、女性。BMI 15kg/m<sup>2<\/sup>。神経性やせ症(神経性食欲不振症)。心療内科に通院をしていたが、自己判断による食事摂取制限や下剤の常用、自己誘発性嘔吐を繰り返し、無月経が認められ入院となった。この患者のアセスメントの結果と関連する病態の組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）BMI 15kg/m<sup>2<\/sup> ――― 血圧の上昇<\/p><p class=\"ch\">（2）食事摂取制限 ――― 除脂肪体重の増加<\/p><p class=\"ch\">（3）下剤の常用 ――― 血清カリウム値の上昇<\/p><p class=\"ch\">（4）自己誘発性嘔吐 ――― う歯の増加<\/p><p class=\"ch\">（5）無月経 ――― 骨密度の上昇<\/p>","choices":5,"answer":4},{"id":"37-130","exam":37,"num":130,"subject":7,"qhtml":"<p><b>130<\/b>　COPDの病態と栄養管理に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）呼吸筋の酸素消費量は、減少する。<\/p><p class=\"ch\">（2）基礎代謝量は、減少する。<\/p><p class=\"ch\">（3）骨密度は、低下する。<\/p><p class=\"ch\">（4）エネルギー摂取量は、制限する。<\/p><p class=\"ch\">（5）BCAA摂取量は、制限する。<\/p>","choices":5,"answer":3},{"id":"37-131","exam":37,"num":131,"subject":7,"qhtml":"<p><b>131<\/b>　骨粗鬆症の治療時に摂取を推奨する栄養素と、その栄養素を多く含む食品の組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ビタミンD ――― しろさけ<\/p><p class=\"ch\">（2）ビタミンD ――― ささみ<\/p><p class=\"ch\">（3）ビタミンK ――― じゃがいも<\/p><p class=\"ch\">（4）ビタミンK ――― 木綿豆腐<\/p><p class=\"ch\">（5）カルシウム ――― しいたけ<\/p>","choices":5,"answer":1},{"id":"37-132","exam":37,"num":132,"subject":7,"qhtml":"<p><b>132<\/b>　食物アレルギーに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）オボムコイドは、加熱により抗原性が低下する。<\/p><p class=\"ch\">（2）オボアルブミンは、加熱により抗原性が増大する。<\/p><p class=\"ch\">（3）ピーナッツは、炒ることで抗原性が低下する。<\/p><p class=\"ch\">（4）小麦アレルギーでは、米粉を代替食品として用いることができる。<\/p><p class=\"ch\">（5）鶏肉は、特定原材料として表示が義務づけられている。<\/p>","choices":5,"answer":4},{"id":"37-133","exam":37,"num":133,"subject":7,"qhtml":"<p><b>133<\/b>　進行大腸がん患者に対し、4週間の放射線療法を開始したところ、イレウスをきたした。治療を継続するため長期の栄養管理が必要である。この患者に対して、現時点で選択すべき栄養投与方法として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）経口栄養<\/p><p class=\"ch\">（2）経鼻胃管による経腸栄養<\/p><p class=\"ch\">（3）胃瘻造設による経腸栄養<\/p><p class=\"ch\">（4）末梢静脈栄養<\/p><p class=\"ch\">（5）中心静脈栄養<\/p>","choices":5,"answer":5},{"id":"37-134","exam":37,"num":134,"subject":7,"qhtml":"<p><b>134<\/b>　胃切除患者における術前・術後の病態と栄養管理に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）経口補水は、術前2～3時間まで可能である。<\/p><p class=\"ch\">（2）術後の早期経腸栄養法の開始は、腸管バリア機能を障害する。<\/p><p class=\"ch\">（3）早期ダンピング症候群では、低血糖症状が認められる。<\/p><p class=\"ch\">（4）胃全摘術後は、カルシウムの吸収量が増加する。<\/p><p class=\"ch\">（5）胃全摘術後は、再生不良性貧血が認められる。<\/p>","choices":5,"answer":1},{"id":"37-135","exam":37,"num":135,"subject":7,"qhtml":"<p><b>135<\/b>　消化管機能が保たれている重症外傷患者である。受傷後2日目から経腸栄養法を開始した。<\/p><p>誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）投与ルートは、経鼻胃管とする。<\/p><p class=\"ch\">（2）経腸栄養剤は、半消化態栄養剤とする。<\/p><p class=\"ch\">（3）投与目標量は、25～30kcal/kg標準体重/日とする。<\/p><p class=\"ch\">（4）開始時の投与速度は、200mL/時とする。<\/p><p class=\"ch\">（5）血糖値の目標は、180mg/dL以下とする。<\/p>","choices":5,"answer":4},{"id":"37-136","exam":37,"num":136,"subject":7,"qhtml":"<p><b>136<\/b>　ホモシスチン尿症の治療で制限するアミノ酸である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ロイシン<\/p><p class=\"ch\">（2）バリン<\/p><p class=\"ch\">（3）メチオニン<\/p><p class=\"ch\">（4）シスチン<\/p><p class=\"ch\">（5）フェニルアラニン<\/p>","choices":5,"answer":3},{"id":"37-137","exam":37,"num":137,"subject":8,"qhtml":"<p><b>137<\/b>　公衆栄養活動に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）エンパワメントとは、地域の人々の結束力を示すものである。<\/p><p class=\"ch\">（2）ハイリスクアプローチでは、対象を限定せず、全体への働きかけを行う。<\/p><p class=\"ch\">（3）ヘルスプロモーション活動の一環として行われる。<\/p><p class=\"ch\">（4）コミュニティオーガニゼーションは、自治体が行う。<\/p><p class=\"ch\">（5）医療機関に通院中の者は、対象としない。<\/p>","choices":5,"answer":3},{"id":"37-138","exam":37,"num":138,"subject":8,"qhtml":"<p><b>138<\/b>　国民健康・栄養調査（国民栄養調査）結果における、脂質の食品群別摂取構成比率の推移である(図)。図のa～dに該当する食品群の組合せとして、最も適当なのはどれか。1つ選べ。<\/p><p>a　　　　　　b　　　　　　c　　　　　　d<\/p><p class=\"ch\">（1）魚介類 ――― 乳類 ――― 肉類 ――― 油脂類<\/p><p class=\"ch\">（2）魚介類 ――― 肉類 ――― 油脂類 ――― 乳類<\/p><p class=\"ch\">（3）肉類 ――― 魚介類 ――― 油脂類 ――― 乳類<\/p><p class=\"ch\">（4）乳類 ――― 魚介類 ――― 肉類 ――― 油脂類<\/p><p class=\"ch\">（5）油脂類 ――― 魚介類 ――― 肉類 ――― 乳類<\/p><img class=\"fig\" src=\"img/q37_image6.jpg\" alt=\"図表\" data-zoom=\"img/q37_image6.jpg\">","choices":5,"answer":5},{"id":"37-139","exam":37,"num":139,"subject":8,"qhtml":"<p><b>139<\/b>　食料需給表から算出された、わが国の食料自給率のうち、品目別自給率（重量ベース）の年次推移である(図)。図のa～dに該当する食品の組合せとして、最も適当なのはどれか。1つ選べ。<\/p><p>a　　　　　　b　　　　　c　　　　　　d<\/p><p class=\"ch\">（1）野菜 ――― 鶏卵 ――― 小麦 ――― 果実<\/p><p class=\"ch\">（2）野菜 ――― 小麦 ――― 鶏卵 ――― 果実<\/p><p class=\"ch\">（3）果実 ――― 野菜 ――― 小麦 ――― 鶏卵<\/p><p class=\"ch\">（4）鶏卵 ――― 野菜 ――― 果実 ――― 小麦<\/p><p class=\"ch\">（5）鶏卵 ――― 果実 ――― 野菜 ――― 小麦<\/p><img class=\"fig\" src=\"img/q37_image7.jpg\" alt=\"図表\" data-zoom=\"img/q37_image7.jpg\">","choices":5,"answer":4},{"id":"37-140","exam":37,"num":140,"subject":8,"qhtml":"<p><b>140<\/b>　開発途上国における5歳未満の子どもの栄養状態に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）過栄養の問題は、みられない。<\/p><p class=\"ch\">（2）低体重は、身長別体重で評価される。<\/p><p class=\"ch\">（3）発育阻害は、年齢別体重で評価される。<\/p><p class=\"ch\">（4）消耗症は、年齢別身長で評価される。<\/p><p class=\"ch\">（5）低栄養の評価指標として、WHOのZスコアがある。<\/p>","choices":5,"answer":5},{"id":"37-141","exam":37,"num":141,"subject":8,"qhtml":"<p><b>141<\/b>　食育基本法に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）食育推進会議の会長は、厚生労働大臣が務める。<\/p><p class=\"ch\">（2）食育の推進に当たって、国民の責務を規定している。<\/p><p class=\"ch\">（3）子ども食堂の設置基準を規定している。<\/p><p class=\"ch\">（4）特定保健指導の実施を規定している。<\/p><p class=\"ch\">（5）栄養教諭の配置を規定している。<\/p>","choices":5,"answer":2},{"id":"37-142","exam":37,"num":142,"subject":8,"qhtml":"<p><b>142<\/b>　健康増進法に規定されているものである。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）都道府県健康増進計画の策定<\/p><p class=\"ch\">（2）健康診査等指針の策定<\/p><p class=\"ch\">（3）生活習慣病の発生状況の把握<\/p><p class=\"ch\">（4）受動喫煙防止の対策<\/p><p class=\"ch\">（5）食品表示基準の策定<\/p>","choices":5,"answer":5},{"id":"37-143","exam":37,"num":143,"subject":8,"qhtml":"<p><b>143<\/b>　栄養士法に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）第二次世界大戦後に制定された。<\/p><p class=\"ch\">（2）栄養士は、傷病者に対する療養のために必要な栄養の指導を行うことを業とする者と規定している。<\/p><p class=\"ch\">（3）管理栄養士免許は、都道府県知事が与える。<\/p><p class=\"ch\">（4）食生活改善推進員の業務内容を規定している。<\/p><p class=\"ch\">（5）保健所における管理栄養士の配置基準を規定している。<\/p>","choices":5,"answer":1},{"id":"37-144","exam":37,"num":144,"subject":8,"qhtml":"<p><b>144<\/b>　国民健康・栄養調査に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）地域保健法に基づき実施される。<\/p><p class=\"ch\">（2）健康日本21（第二次）の評価に用いられる。<\/p><p class=\"ch\">（3）調査の企画・立案は、都道府県が行う。<\/p><p class=\"ch\">（4）栄養摂取状況調査の対象には、乳児が含まれる。<\/p><p class=\"ch\">（5）栄養摂取状況調査の結果は、世帯当たりの平均摂取量として示される。<\/p>","choices":5,"answer":2},{"id":"37-145","exam":37,"num":145,"subject":8,"qhtml":"<p><b>145<\/b>　食事バランスガイドに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）食育推進基本計画を具体的に行動に結びつけるものである。<\/p><p class=\"ch\">（2）運動の重要性が示されている。<\/p><p class=\"ch\">（3）摂取すべき水分の量が示されている。<\/p><p class=\"ch\">（4）菓子は主食に含まれる。<\/p><p class=\"ch\">（5）1食で摂るサービング(SV)の数が示されている。<\/p>","choices":5,"answer":2},{"id":"37-146","exam":37,"num":146,"subject":8,"qhtml":"<p><b>146<\/b>　食事調査法に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）24時間食事思い出し法は、高齢者の調査に適している。<\/p><p class=\"ch\">（2）食事記録法は、食物摂取頻度調査法に比べて、対象者の負担が小さい。<\/p><p class=\"ch\">（3）食事記録法において、目安量法は秤量法に比べて、摂取量推定の誤差が小さい。<\/p><p class=\"ch\">（4）食物摂取頻度調査法の再現性は、同一集団を対象として検討される。<\/p><p class=\"ch\">（5）陰膳法により推定した栄養素等摂取量は、食品成分表の影響を受ける。<\/p>","choices":5,"answer":4},{"id":"37-147","exam":37,"num":147,"subject":8,"qhtml":"<p><b>147<\/b>　学生100人を対象に、7日間の食事調査を実施し、個人の平均的な摂取量を把握した。その結果を基に、集団としての平均値と標準偏差を算出した(表)。変動係数が最小のものである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）エネルギー<\/p><p class=\"ch\">（2）たんぱく質<\/p><p class=\"ch\">（3）脂肪エネルギー比率<\/p><p class=\"ch\">（4）ビタミンB<sub>12<\/sub><\/p><p class=\"ch\">（5）ビタミンC<\/p><img class=\"fig\" src=\"img/q37_image8.jpg\" alt=\"図表\" data-zoom=\"img/q37_image8.jpg\">","choices":5,"answer":3},{"id":"37-148","exam":37,"num":148,"subject":8,"qhtml":"<p><b>148<\/b>　公衆栄養アセスメントに用いる情報と、その出典の組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）出生率 ――― 国勢調査<\/p><p class=\"ch\">（2）児童の発育状況 ――― 学校保健統計調査<\/p><p class=\"ch\">（3）食中毒の患者数 ――― 感染症発生動向調査<\/p><p class=\"ch\">（4）世帯の食料費 ――― 国民生活基礎調査<\/p><p class=\"ch\">（5）健康診断受診の状況 ――― 患者調査<\/p>","choices":5,"answer":2},{"id":"37-149","exam":37,"num":149,"subject":8,"qhtml":"<p><b>149<\/b>　日本人の食事摂取基準(2020年版)を用いた、成人集団における食事摂取状況の評価とその指標の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）エネルギーの過剰摂取 ――― 推定エネルギー必要量(EER)を超えて摂取している者の割合<\/p><p class=\"ch\">（2）エネルギーの摂取不足 ――― BMIの平均値と目標とするBMIの範囲の下限値との差<\/p><p class=\"ch\">（3）栄養素の摂取不足 ――― 栄養素の平均摂取量とRDAの差<\/p><p class=\"ch\">（4）栄養素の摂取不足 ――― EARを下回る者の割合<\/p><p class=\"ch\">（5）栄養素の過剰摂取 ――― AIを上回る者の割合<\/p>","choices":5,"answer":4},{"id":"37-150","exam":37,"num":150,"subject":8,"qhtml":"<p><b>150<\/b>　公衆栄養プログラムの目標設定に関する記述である。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）目標は、地域の現状を評価した上で設定する。<\/p><p class=\"ch\">（2）候補となる目標が複数ある場合は、重要度と改善可能性がいずれも高いものを最優先とする。<\/p><p class=\"ch\">（3）目標達成までの取組期間を明示する。<\/p><p class=\"ch\">（4）課題解決型アプローチでは、目標値は住民が設定する。<\/p><p class=\"ch\">（5）目標値は、対象集団から得られた調査結果を参考に設定する。<\/p>","choices":5,"answer":4},{"id":"37-151","exam":37,"num":151,"subject":8,"qhtml":"<p><b>151<\/b>　地域包括ケアシステムに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）地域包括ケアシステムの構築は、地域保健法に基づく。<\/p><p class=\"ch\">（2）介護保険施設入所者は、対象としない。<\/p><p class=\"ch\">（3）地域ケア会議は、三次医療圏ごとに設置しなければならない。<\/p><p class=\"ch\">（4）地域包括支援センターの設置者は、都道府県である。<\/p><p class=\"ch\">（5）地域支援事業は、介護予防を目的とした事業である。<\/p>","choices":5,"answer":5},{"id":"37-152","exam":37,"num":152,"subject":8,"qhtml":"<p><b>152<\/b>　K市の地図である(図)。A地区は、学生を中心とした若い世代の一人暮らし世帯が多く、中食・外食の利用頻度が高く、野菜摂取量が少ない。B地区は、野菜の生産が盛んである。K市における、A地区の若い世代の野菜摂取量増加に向けた、食物へのアクセスと情報へのアクセスを統合させた効果的な取組に関する記述である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）A地区内のスーパーマーケットやコンビニエンスストアの店内に、野菜摂取量の増加を推奨するポスターを掲示する。<\/p><p class=\"ch\">（2）A地区の駅構内の特設コーナーにおいて、B地区の生産者組合と協働して、地元野菜の直売所を開設し販売するとともに、1日当たりの野菜摂取量の目標として350gの野菜の実物展示を行う。<\/p><p class=\"ch\">（3）A地区において、各大学食堂や外食店と協働して、月替わりで、B地区産の野菜たっぷりメニューの提供と、野菜料理の簡単レシピ集の配布を行う。<\/p><p class=\"ch\">（4）A地区の七夕祭りにおいて、B地区の生産者組合と協働して、栄養バランスのとれた食生活に関する講話と地元野菜の無料配布会を行う。<\/p><img class=\"fig\" src=\"img/q37_image9.jpg\" alt=\"図表\" data-zoom=\"img/q37_image9.jpg\">","choices":4,"answer":3},{"id":"37-153","exam":37,"num":153,"subject":9,"qhtml":"<p><b>153<\/b>　特定給食施設の設置者が取り組むことで、利用者の適切な栄養管理につながるものである。<\/p><p>誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）利用者の身体状況を共有する多職種協働チームの設置<\/p><p class=\"ch\">（2）品温管理された食事を提供するための設備の導入<\/p><p class=\"ch\">（3）給食の生ごみのリサイクルの推進<\/p><p class=\"ch\">（4）施設の栄養管理システムのデジタル化の推進<\/p><p class=\"ch\">（5）衛生管理に関する責任者の指名<\/p>","choices":5,"answer":3},{"id":"37-154","exam":37,"num":154,"subject":9,"qhtml":"<p><b>154<\/b>　健康増進法に基づく、特定給食施設と管理栄養士の配置に関する組合せである。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）朝食、昼食、夕食の合計で300食を提供する児童自立支援施設 ――― 配置しなければならない。<\/p><p class=\"ch\">（2）朝食300食、夕食300食を提供する学生寮 ――― 配置しなければならない。<\/p><p class=\"ch\">（3）昼食400食を提供する学生食堂 ――― 配置しなければならない。<\/p><p class=\"ch\">（4）朝食150食、昼食450食、夕食150食を提供する事業所 ――― 配置するよう努めなければならない。<\/p><p class=\"ch\">（5）1回300食を提供する病院 ――― 配置するよう努めなければならない。<\/p>","choices":5,"answer":4},{"id":"37-155","exam":37,"num":155,"subject":9,"qhtml":"<p><b>155<\/b>　給食経営管理におけるトータルシステムに関する内容である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）食材料に関する情報をコンピュータ端末から入力し、発注する仕組み<\/p><p class=\"ch\">（2）給食経営の管理業務ごとにマネジメントサイクルを回し、それらを連動させて機能させる仕組み<\/p><p class=\"ch\">（3）複数の施設に食事を供給するために、1か所の調理施設で集中して調理できる機能をもたせる仕組み<\/p><p class=\"ch\">（4）給食を、クックチルとクックサーブを統合させて運営する仕組み<\/p><p class=\"ch\">（5）配膳方法に適した配膳設備を活用して、出来上がった食事を利用者に適切な状態で提供する仕組み<\/p>","choices":5,"answer":2},{"id":"37-156","exam":37,"num":156,"subject":9,"qhtml":"<p><b>156<\/b>　健康日本21(第二次)では、特定給食施設における適切な栄養管理の実施状況に関して、管理栄養士・栄養士の配置割合を評価指標とし、目標値を80％としている。この目標値に達していない施設である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）病院<\/p><p class=\"ch\">（2）介護老人保健施設<\/p><p class=\"ch\">（3）社会福祉施設<\/p><p class=\"ch\">（4）老人福祉施設<\/p><p class=\"ch\">（5）事業所<\/p>","choices":5,"answer":5},{"id":"37-157","exam":37,"num":157,"subject":9,"qhtml":"<p><b>157<\/b>　病院において給食の運営業務を外部委託することで、委託側が軽減できる業務である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）嗜好調査の実施<\/p><p class=\"ch\">（2）食事療養に関する会議の開催<\/p><p class=\"ch\">（3）食事箋の管理<\/p><p class=\"ch\">（4）給食従事者の労務管理<\/p><p class=\"ch\">（5）検食の実施<\/p>","choices":5,"answer":4},{"id":"37-158","exam":37,"num":158,"subject":9,"qhtml":"<p><b>158<\/b>　給食経営における資源に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）オール電化された厨房は、人的資源に当たる。<\/p><p class=\"ch\">（2）ABC分析に基づいてAグループの食材を重点管理することは、物的資源の有効活用に当たる。<\/p><p class=\"ch\">（3）調理従事者に衛生教育を実施することは、資金的資源の有効活用に当たる。<\/p><p class=\"ch\">（4）新しい大量調理機器の情報は、方法的資源に当たる。<\/p><p class=\"ch\">（5）省エネルギー調理機器の導入は、情報的資源の有効活用に当たる。<\/p>","choices":5,"answer":2},{"id":"37-159","exam":37,"num":159,"subject":9,"qhtml":"<p><b>159<\/b>　K社員食堂における月間の売上高は400万円、固定費160万円、変動費200万円である。損益分岐点売上高(万円)として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）180<\/p><p class=\"ch\">（2）200<\/p><p class=\"ch\">（3）240<\/p><p class=\"ch\">（4）320<\/p><p class=\"ch\">（5）360<\/p>","choices":5,"answer":4},{"id":"37-160","exam":37,"num":160,"subject":9,"qhtml":"<p><b>160<\/b>　社員食堂の現行メニューの販売戦略を立てるため、PPM(プロダクト・ポートフォリオ・マネジメント)を行った(図)。売上成長率は今期以前の売上に対する成長率を示す。分析結果を踏まえた販売戦略として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）カテゴリーAに分類されたメニューは、売上構成比が低いため、廃止する。<\/p><p class=\"ch\">（2）カテゴリーBに分類されたメニューは、売上成長率および売上構成比が高いため、積極的な販売促進活動を行う。<\/p><p class=\"ch\">（3）カテゴリーCに分類されたメニューは、売上成長率および売上構成比が低いため、販売価格を上げる。<\/p><p class=\"ch\">（4）カテゴリーDに分類されたメニューは、売上構成比が高く安定した収益が得られるため、販売価格を下げる。<\/p><p class=\"ch\">（5）カテゴリーDに分類されたメニューは、売上成長率が低く、今後の成長が見込めないため、廃止する。<\/p><img class=\"fig\" src=\"img/q37_image10.jpg\" alt=\"図表\" data-zoom=\"img/q37_image10.jpg\">","choices":5,"answer":2},{"id":"37-161","exam":37,"num":161,"subject":9,"qhtml":"<p><b>161<\/b>　K病院栄養部門(図)の組織・人事管理に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）栄養課長が、全ての調理従事者に調理作業を指示する。<\/p><p class=\"ch\">（2）栄養課主任が、トレイメイクの最終確認を行う。<\/p><p class=\"ch\">（3）給食課長が、調理師のための衛生研修会を企画する。<\/p><p class=\"ch\">（4）給食課長が、栄養課の業務配置を決定する。<\/p><p class=\"ch\">（5）調理師長が、食事形態について看護部門長と調整を行う。<\/p><img class=\"fig\" src=\"img/q37_image11.jpg\" alt=\"図表\" data-zoom=\"img/q37_image11.jpg\">","choices":5,"answer":3},{"id":"37-162","exam":37,"num":162,"subject":9,"qhtml":"<p><b>162<\/b>　保育所における3歳以上児の栄養・食事計画に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）給与栄養目標量は、身長・体重の測定結果を参照して定期的に見直す。<\/p><p class=\"ch\">（2）たんぱく質の給与目標量は、日本人の食事摂取基準におけるEARを用いて設定する。<\/p><p class=\"ch\">（3）カルシウムの給与目標量は、昼食とおやつの合計が1日の給与栄養目標量の1/3を超えないよう設定する。<\/p><p class=\"ch\">（4）1回の昼食で使用する肉の重量は、食品構成表にある肉類の使用重量と一致させる。<\/p><p class=\"ch\">（5）児の嗜好に配慮し、濃い味付けとする。<\/p>","choices":5,"answer":1},{"id":"37-163","exam":37,"num":163,"subject":9,"qhtml":"<p><b>163<\/b>　表は、単一献立を提供している学生寮の夕食の期間献立である。表の(a)に入る主菜として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）白身魚のムニエル<\/p><p class=\"ch\">（2）回鍋肉<\/p><p class=\"ch\">（3）豆腐の豆乳グラタン<\/p><p class=\"ch\">（4）ポークソテー<\/p><img class=\"fig\" src=\"img/q37_image12.jpg\" alt=\"図表\" data-zoom=\"img/q37_image12.jpg\">","choices":4,"answer":4},{"id":"37-164","exam":37,"num":164,"subject":9,"qhtml":"<p><b>164<\/b>　社員証で電子決済ができるカフェテリア方式の社員食堂における、栄養・食事管理の評価に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）利用者集団の料理選択行動の課題を、料理の組合せに関する販売記録から評価する。<\/p><p class=\"ch\">（2）利用者個人のエネルギー摂取量を、残食数から評価する。<\/p><p class=\"ch\">（3）利用者集団の栄養状態を、食堂の利用率から評価する。<\/p><p class=\"ch\">（4）利用者個人の給食に対する満足度を、検食簿から評価する。<\/p><p class=\"ch\">（5）微量栄養素の給与目標量を、社員のBMIの分布から評価する。<\/p>","choices":5,"answer":1},{"id":"37-165","exam":37,"num":165,"subject":9,"qhtml":"<p><b>165<\/b>　給食の品質管理に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）設計品質は、ABC分析で評価する。<\/p><p class=\"ch\">（2）適合(製造)品質は、期末在庫量で評価する。<\/p><p class=\"ch\">（3）適合(製造)品質は、検食で評価する。<\/p><p class=\"ch\">（4）総合品質は、ISO14001で評価する。<\/p><p class=\"ch\">（5）総合品質は、給与栄養目標量で評価する。<\/p>","choices":5,"answer":3},{"id":"37-166","exam":37,"num":166,"subject":9,"qhtml":"<p><b>166<\/b>　クックチルシステムに関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）クックサーブシステムに比べ、多くの調理従事者が必要である。<\/p><p class=\"ch\">（2）前倒し調理により、調理作業の閑忙の平準化が可能である。<\/p><p class=\"ch\">（3）加熱調理後は、90分以内に中心温度5℃まで冷却する。<\/p><p class=\"ch\">（4）クックフリーズシステムに比べ、保存日数が長い。<\/p><p class=\"ch\">（5）提供直前の再加熱は、中心温度65℃、1分間以上加熱する。<\/p>","choices":5,"answer":2},{"id":"37-167","exam":37,"num":167,"subject":9,"qhtml":"<p><b>167<\/b>　1日の食数が1,200食の特定給食施設における調理従事者数は、正社員(8時間/人/日)5人とパートタイマー(4時間/人/日)15人である。この場合の労働生産性(食/時間)として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）12<\/p><p class=\"ch\">（2）50<\/p><p class=\"ch\">（3）60<\/p><p class=\"ch\">（4）100<\/p><p class=\"ch\">（5）150<\/p>","choices":5,"answer":1},{"id":"37-168","exam":37,"num":168,"subject":9,"qhtml":"<p><b>168<\/b>　給食施設において、インシデントレポートを分析したところ、毛髪の混入が最も多かった。その改善策に関する記述である。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ネット帽を被ってから、帽子を被るようにした。<\/p><p class=\"ch\">（2）毛髪の乱れが起こらないように、調理従事者はヘアピンを使用するようにした。<\/p><p class=\"ch\">（3）調理開始前に調理従事者同士で、着衣(帽子、調理服)に粘着ローラーをかけることにした。<\/p><p class=\"ch\">（4）盛付け開始時に複数の調理従事者で、着衣(帽子、調理服)を確認し合うことにした。<\/p><p class=\"ch\">（5）インシデント発生時間帯を分析し、着衣(帽子、調理服)を見直す時間帯を決めた。<\/p>","choices":5,"answer":2},{"id":"37-169","exam":37,"num":169,"subject":9,"qhtml":"<p><b>169<\/b>　トンカツ(付け合わせ:せんキャベツ)を調理する過程で、大量調理施設衛生管理マニュアルに基づいて実施した作業に関する記述である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）肉の検収時の表面温度が7℃であったため、受け取った。<\/p><p class=\"ch\">（2）同じ調理台で、割卵作業とキャベツの切裁作業を行った。<\/p><p class=\"ch\">（3）フライヤーの横の調理台で、肉に衣を付けた。<\/p><p class=\"ch\">（4）揚がったトンカツの表面温度が75℃であったため、出来上がりとした。<\/p><p class=\"ch\">（5）盛付けを、前の作業に使用した手袋をはめたまま行った。<\/p>","choices":5,"answer":1},{"id":"37-170","exam":37,"num":170,"subject":9,"qhtml":"<p><b>170<\/b>　食中毒の発生が疑われた場合に、その発生原因を特定するために必要なものと確認内容の組合せである。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）検便結果表 ――― 調理担当者の勤務状況<\/p><p class=\"ch\">（2）加熱調理の中心温度記録簿 ――― 食材料の保管温度<\/p><p class=\"ch\">（3）原材料の検食(保存食) ――― 調理食数<\/p><p class=\"ch\">（4）検収簿 ――― 食材料の納品温度<\/p><p class=\"ch\">（5）調理工程表 ――― 食材料の購入先<\/p>","choices":5,"answer":4},{"id":"37-171","exam":37,"num":171,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「171」、「172」、「173」に答えよ。<\/p><p>K産科・小児科クリニックの管理栄養士である。<\/p><p>相談者は、1歳1か月の女児とその母親。女児は、第一子、在胎40週、出生時体重は2,850g。1か月健診、4か月健診、いずれも成長・発達は順調で、同クリニックで1歳児健診を受けることとなった。<\/p><p>1歳児健診の問診票に、1日3回離乳食を食べているが、子どもの気になる様子として、「偏食」、「肉や魚を食べない」と記載されていた。1歳児健診の身長73cm、体重9.0kg、歯は上下合わせて前歯4本が生えていた。<\/p><\/div><p><b>171<\/b>　健診当日に個別相談を行った。女児は、棒状にした飯を手に持って口に入れ、顎を左右に動かして噛む動きがみられた。口の中の様子を見ると、飯粒を潰せないまま飲み込んでいた。女児の離乳の段階である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）離乳初期<\/p><p class=\"ch\">（2）離乳中期<\/p><p class=\"ch\">（3）離乳後期<\/p><p class=\"ch\">（4）離乳完了期<\/p>","choices":4,"answer":3},{"id":"37-172","exam":37,"num":172,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「171」、「172」、「173」に答えよ。<\/p><p>K産科・小児科クリニックの管理栄養士である。<\/p><p>相談者は、1歳1か月の女児とその母親。女児は、第一子、在胎40週、出生時体重は2,850g。1か月健診、4か月健診、いずれも成長・発達は順調で、同クリニックで1歳児健診を受けることとなった。<\/p><p>1歳児健診の問診票に、1日3回離乳食を食べているが、子どもの気になる様子として、「偏食」、「肉や魚を食べない」と記載されていた。1歳児健診の身長73cm、体重9.0kg、歯は上下合わせて前歯4本が生えていた。<\/p><\/div><p><b>172<\/b>　個別相談の際、母親は、「市販の鮭フレークを混ぜたごはんは食べるので、鮭は好きかもしれないと思ったのですが、一口大の焼き鮭は食べられませんでした。」と話した。母親が続けて話した女児の焼き鮭の食べ方である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）口に入れることを嫌がります。<\/p><p class=\"ch\">（2）口に入れるとすぐに吐き出します。<\/p><p class=\"ch\">（3）噛み潰さずに飲み込もうとして、おぇっとして吐き出します。<\/p><p class=\"ch\">（4）口の中で、もぐもぐしたままでいます。<\/p>","choices":4,"answer":4},{"id":"37-173","exam":37,"num":173,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「171」、「172」、「173」に答えよ。<\/p><p>K産科・小児科クリニックの管理栄養士である。<\/p><p>相談者は、1歳1か月の女児とその母親。女児は、第一子、在胎40週、出生時体重は2,850g。1か月健診、4か月健診、いずれも成長・発達は順調で、同クリニックで1歳児健診を受けることとなった。<\/p><p>1歳児健診の問診票に、1日3回離乳食を食べているが、子どもの気になる様子として、「偏食」、「肉や魚を食べない」と記載されていた。1歳児健診の身長73cm、体重9.0kg、歯は上下合わせて前歯4本が生えていた。<\/p><\/div><p><b>173<\/b>　母親から、「肉や魚をあまり食べないので、その分、母乳を減らさずにあげています。どのようにしたら、肉や魚を食べるようになりますか。」と質問された。管理栄養士の応答である。<\/p><p>最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）授乳回数を減らしてお腹が空けば、肉や魚も食べるかもしれませんね。<\/p><p class=\"ch\">（2）肉や魚を食べなくても、卵や豆腐、牛乳でたんぱく質を摂れていれば問題ないですよ。<\/p><p class=\"ch\">（3）前歯は生えているので、硬いものを食べて、噛む練習をしてみましょう。<\/p><p class=\"ch\">（4）肉や魚は、軟らかくして、ほぐしたら食べられるかもしれません。<\/p>","choices":4,"answer":4},{"id":"37-174","exam":37,"num":174,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「174」、「175」、「176」に答えよ。<\/p><p>Kクリニックに勤務する管理栄養士である。<\/p><p>患者は、42歳、女性。2型糖尿病と診断された。<\/p><p>身長155cm、体重62kg、BMI 25.8kg/m<sup>2<\/sup>。標準体重53kg。血圧136/82mmHg。空腹時の血液検査値は、HbA1c7.0％、血糖130mg/dL、AST30U/L、ALT40U/L、LDLコレステロール144mg/dL、トリグリセリド280mg/dL。<\/p><p>医師から、1日の指示エネルギー量を1,800kcal、炭水化物エネルギー比率を50%Eとして栄養食事指導を行うよう指示があった。<\/p><\/div><p><b>174<\/b>　この患者に普段の食事を聞き取った(表1)。この患者の優先すべき栄養上の問題である。<\/p><p>最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）たんぱく質の摂取量が多い。<\/p><p class=\"ch\">（2）脂肪の摂取量が多い。<\/p><p class=\"ch\">（3）炭水化物の摂取量が多い。<\/p><p class=\"ch\">（4）食塩の摂取量が多い。<\/p><img class=\"fig\" src=\"img/q37_image13.jpg\" alt=\"図表\" data-zoom=\"img/q37_image13.jpg\">","choices":4,"answer":3},{"id":"37-175","exam":37,"num":175,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「174」、「175」、「176」に答えよ。<\/p><p>Kクリニックに勤務する管理栄養士である。<\/p><p>患者は、42歳、女性。2型糖尿病と診断された。<\/p><p>身長155cm、体重62kg、BMI 25.8kg/m<sup>2<\/sup>。標準体重53kg。血圧136/82mmHg。空腹時の血液検査値は、HbA1c7.0％、血糖130mg/dL、AST30U/L、ALT40U/L、LDLコレステロール144mg/dL、トリグリセリド280mg/dL。<\/p><p>医師から、1日の指示エネルギー量を1,800kcal、炭水化物エネルギー比率を50%Eとして栄養食事指導を行うよう指示があった。<\/p><\/div><p><b>175<\/b>　設問174を踏まえ、栄養食事指導を行い、その1か月後に2回目の栄養食事指導を行った。2回目の指導時に、患者が持参した1日分の食事記録から、糖尿病食事療法のための食品交換表に基づき単位の計算を行った(表2)。1日の合計単位数は20.2単位であった。優先的に改善を指導する項目である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）「表1」<\/p><p class=\"ch\">（2）「表3」<\/p><p class=\"ch\">（3）「表6」<\/p><p class=\"ch\">（4）「調味料」<\/p><img class=\"fig\" src=\"img/q37_image14.jpg\" alt=\"図表\" data-zoom=\"img/q37_image14.jpg\">","choices":4,"answer":1},{"id":"37-176","exam":37,"num":176,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「174」、「175」、「176」に答えよ。<\/p><p>Kクリニックに勤務する管理栄養士である。<\/p><p>患者は、42歳、女性。2型糖尿病と診断された。<\/p><p>身長155cm、体重62kg、BMI 25.8kg/m<sup>2<\/sup>。標準体重53kg。血圧136/82mmHg。空腹時の血液検査値は、HbA1c7.0％、血糖130mg/dL、AST30U/L、ALT40U/L、LDLコレステロール144mg/dL、トリグリセリド280mg/dL。<\/p><p>医師から、1日の指示エネルギー量を1,800kcal、炭水化物エネルギー比率を50%Eとして栄養食事指導を行うよう指示があった。<\/p><\/div><p><b>176<\/b>　患者が2回目の指導時に持参した食事記録の内容(表2)に対する、具体的なアドバイスである。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）夕食で、昼食と同じくらいの量のごはんを食べましょう。<\/p><p class=\"ch\">（2）昼食の鶏肉を、皮つきにしましょう。<\/p><p class=\"ch\">（3）朝食のカフェオレを、市販の野菜ジュースにしましょう。<\/p><p class=\"ch\">（4）昼食の味噌汁を、コーンポタージュにしましょう。<\/p>","choices":4,"answer":1},{"id":"37-177","exam":37,"num":177,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「177」、「178」、「179」に答えよ。<\/p><p>K病院に勤務する管理栄養士である。<\/p><p>患者は、58歳、男性。COPDで、3年前より吸入薬を使用していた。風邪がきっかけで呼吸困難となり救急搬送された。入院後、気管支拡張薬、ステロイド薬が投与され、酸素療法を行っている。<\/p><p>入院時、身長170cm、体重50kg、BMI 17.3kg/m<sup>2<\/sup>。血圧132/90mmHg、心拍数135回/分、血清アルブミン値3.8g/dL、安静時エネルギー消費量1,440kcal/日。<\/p><\/div><p><b>177<\/b>　この患者の1日当たりの必要エネルギー量(kcal)を算出した。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）1,200<\/p><p class=\"ch\">（2）1,440<\/p><p class=\"ch\">（3）1,800<\/p><p class=\"ch\">（4）2,200<\/p><p class=\"ch\">（5）2,600<\/p>","choices":5,"answer":4},{"id":"37-178","exam":37,"num":178,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「177」、「178」、「179」に答えよ。<\/p><p>K病院に勤務する管理栄養士である。<\/p><p>患者は、58歳、男性。COPDで、3年前より吸入薬を使用していた。風邪がきっかけで呼吸困難となり救急搬送された。入院後、気管支拡張薬、ステロイド薬が投与され、酸素療法を行っている。<\/p><p>入院時、身長170cm、体重50kg、BMI 17.3kg/m<sup>2<\/sup>。血圧132/90mmHg、心拍数135回/分、血清アルブミン値3.8g/dL、安静時エネルギー消費量1,440kcal/日。<\/p><\/div><p><b>178<\/b>　入院1日目は呼吸苦や腹部膨満感により食事を摂取できなかった。入院2日目に、静脈栄養法と併せて、経口摂取による栄養補給を行った。用いる栄養補助食品である。<\/p><p>最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）嚥下困難者用ゼリー(9kcal/150g)<\/p><p class=\"ch\">（2）MCT含有ゼリー(200kcal/80g)<\/p><p class=\"ch\">（3）低リンミルク(90kcal/100mL)<\/p><p class=\"ch\">（4）低カリウムミルク(85kcal/100mL)<\/p>","choices":4,"answer":2},{"id":"37-179","exam":37,"num":179,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「177」、「178」、「179」に答えよ。<\/p><p>K病院に勤務する管理栄養士である。<\/p><p>患者は、58歳、男性。COPDで、3年前より吸入薬を使用していた。風邪がきっかけで呼吸困難となり救急搬送された。入院後、気管支拡張薬、ステロイド薬が投与され、酸素療法を行っている。<\/p><p>入院時、身長170cm、体重50kg、BMI 17.3kg/m<sup>2<\/sup>。血圧132/90mmHg、心拍数135回/分、血清アルブミン値3.8g/dL、安静時エネルギー消費量1,440kcal/日。<\/p><\/div><p><b>179<\/b>　入院7日目、呼吸状態の改善に従い、食欲の改善も見られ、常食(3回)と栄養補助食品(1回)で、エネルギー目標量の5割を摂取できるようになった。リハビリテーションを開始するため、栄養管理計画を見直した。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）1回当たりの食事量を増やす。<\/p><p class=\"ch\">（2）脂肪エネルギー比率を下げる。<\/p><p class=\"ch\">（3）常食を嚥下調整食に変更する。<\/p><p class=\"ch\">（4）1回当たりの食事提供量を減らして、食事の回数を増やす。<\/p>","choices":4,"answer":4},{"id":"37-180","exam":37,"num":180,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「180」、「181」、「182」に答えよ。<\/p><p>K病院の管理栄養士である。<\/p><p>患者は、72歳、女性。下部食道がん切除および胃管を用いた再建手術の目的で入院した。<\/p><p>身長150cm、体重40kg、BMI 17.8kg/m<sup>2<\/sup>。標準体重50kg。基礎代謝量920kcal/日。入院前、食べ物がつかえる感じはあったが、通常量程度の食事は摂取できていた。入院後も、経口摂取を継続している。<\/p><\/div><p><b>180<\/b>　患者は、放射線治療後に手術を受ける予定である。術直後からの栄養補給方法と、提供する食事または経腸栄養剤の組合せである。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）経口栄養法 ――― 軟菜食<\/p><p class=\"ch\">（2）経管栄養法(食道瘻) ――― 成分栄養剤<\/p><p class=\"ch\">（3）経管栄養法(胃瘻) ――
