― 成分栄養剤<\/p><p class=\"ch\">（4）経管栄養法(空腸瘻) ――― 成分栄養剤<\/p>","choices":4,"answer":4},{"id":"37-181","exam":37,"num":181,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「180」、「181」、「182」に答えよ。<\/p><p>K病院の管理栄養士である。<\/p><p>患者は、72歳、女性。下部食道がん切除および胃管を用いた再建手術の目的で入院した。<\/p><p>身長150cm、体重40kg、BMI 17.8kg/m<sup>2<\/sup>。標準体重50kg。基礎代謝量920kcal/日。入院前、食べ物がつかえる感じはあったが、通常量程度の食事は摂取できていた。入院後も、経口摂取を継続している。<\/p><\/div><p><b>181<\/b>　再建手術直後からの栄養投与目標量の組合せである。最も適切なのはどれか。1つ選べ。<\/p><p>エネルギー(kcal/日) 　　　 たんぱく質(g/日)<\/p><p class=\"ch\">（1）600 ―――――――――――― 30<\/p><p class=\"ch\">（2）600 ―――――――――――― 50<\/p><p class=\"ch\">（3）1,200 ――――――――――― 30<\/p><p class=\"ch\">（4）1,200 ――――――――――― 50<\/p>","choices":4,"answer":4},{"id":"37-182","exam":37,"num":182,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「180」、「181」、「182」に答えよ。<\/p><p>K病院の管理栄養士である。<\/p><p>患者は、72歳、女性。下部食道がん切除および胃管を用いた再建手術の目的で入院した。<\/p><p>身長150cm、体重40kg、BMI 17.8kg/m<sup>2<\/sup>。標準体重50kg。基礎代謝量920kcal/日。入院前、食べ物がつかえる感じはあったが、通常量程度の食事は摂取できていた。入院後も、経口摂取を継続している。<\/p><\/div><p><b>182<\/b>　手術と治療は順調に進み、術後2週間後から常食を開始することになった。食後の過ごし方について、優先的に指導する内容である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）食後1時間程度、仰臥位をとる。<\/p><p class=\"ch\">（2）食後1時間程度、右側臥位をとる。<\/p><p class=\"ch\">（3）食後1時間程度、座位を保つ。<\/p><p class=\"ch\">（4）食後すぐに、歩行訓練のリハビリテーションを始める。<\/p>","choices":4,"answer":3},{"id":"37-183","exam":37,"num":183,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「183」、「184」に答えよ。<\/p><p>Kリハビリテーション病院に勤務する管理栄養士である。<\/p><p>患者は、88歳、女性。数日前から、ろれつが回らなくなったため、急性期病院を受診した。頭部MRIの結果、脳梗塞と診断され入院した。意識はおおむね清明であったが、右片麻痺が認められた。入院翌日、38℃台の発熱、咳、痰を認め、急性肺炎と診断された。肺炎は軽快し、当院へ転院となった。<\/p><\/div><p><b>183<\/b>　精査の結果、患者は嚥下障害が認められたため、摂食嚥下支援チームで対応することになった。日本摂食嚥下リハビリテーション学会嚥下調整食分類のコード0jから、摂食嚥下リハビリテーションを開始することになった。その時の患者の姿勢である。<\/p><p>最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）右側臥位、頸部後屈<\/p><p class=\"ch\">（2）左側臥位、頸部後屈<\/p><p class=\"ch\">（3）右側臥位、頸部前屈<\/p><p class=\"ch\">（4）左側臥位、頸部前屈<\/p>","choices":4,"answer":4},{"id":"37-184","exam":37,"num":184,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「183」、「184」に答えよ。<\/p><p>Kリハビリテーション病院に勤務する管理栄養士である。<\/p><p>患者は、88歳、女性。数日前から、ろれつが回らなくなったため、急性期病院を受診した。頭部MRIの結果、脳梗塞と診断され入院した。意識はおおむね清明であったが、右片麻痺が認められた。入院翌日、38℃台の発熱、咳、痰を認め、急性肺炎と診断された。肺炎は軽快し、当院へ転院となった。<\/p><\/div><p><b>184<\/b>　嚥下調整食分類のコード3の食事まで食べられるようになった時点で、自宅へ退院することになった。患者の家族から、朝食の卵料理を質問された。患者の嚥下機能に適した卵料理として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ゆで卵<\/p><p class=\"ch\">（2）目玉焼き<\/p><p class=\"ch\">（3）スクランブルエッグ<\/p><p class=\"ch\">（4）炒り卵<\/p>","choices":4,"answer":3},{"id":"37-185","exam":37,"num":185,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「185」、「186」に答えよ。<\/p><p>K保育園に勤務する管理栄養士である。園内で食事を作り提供している。3～5歳児の昼食で、野菜の残菜が目立った。そこで、園として食育を実施することにした。<\/p><\/div><p><b>185<\/b>　野菜を残さず食べることを目的とした、3～5歳児向けの食育の内容である。<\/p><p>最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）3色食品群の紙芝居を用いて、栄養を学ぶ。<\/p><p class=\"ch\">（2）実物の野菜を使って、1日に必要な野菜量を学ぶ。<\/p><p class=\"ch\">（3）食品カードを用いて、旬の野菜を知る。<\/p><p class=\"ch\">（4）園内の敷地で野菜を育てて、感謝の気持ちを育む。<\/p>","choices":4,"answer":4},{"id":"37-186","exam":37,"num":186,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「185」、「186」に答えよ。<\/p><p>K保育園に勤務する管理栄養士である。園内で食事を作り提供している。3～5歳児の昼食で、野菜の残菜が目立った。そこで、園として食育を実施することにした。<\/p><\/div><p><b>186<\/b>　保護者向けの食育だよりを発行することにした。子どもの野菜を食べるセルフ・エフィカシーを高める方法として、保護者に行ってほしい内容である。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）野菜が入っているか分からないようにして、料理を提供すること<\/p><p class=\"ch\">（2）野菜の常備菜をいつも冷蔵庫に置いておくこと<\/p><p class=\"ch\">（3）野菜を食べることによる健康のメリットを伝えること<\/p><p class=\"ch\">（4）野菜を残すと作ってくれた農家の人が悲しむと伝えること<\/p><p class=\"ch\">（5）子どもの前で保護者がおいしそうに野菜を食べること<\/p>","choices":5,"answer":5},{"id":"37-187","exam":37,"num":187,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「187」、「188」に答えよ。<\/p><p>K小学校に勤務する栄養教諭である。単独校方式で180食の給食を提供している。調理従事者は、栄養教諭を除いた3名とパートタイマー1名である。パートタイマーをもう1名募集しているが、適任者が見つからない。図は小学校の厨房の図面である。<\/p><\/div><p><b>187<\/b>　焼き物機が老朽化したため、栄養教諭は調理作業の効率化を考慮し、機器購入を予定している。Aの場所に設置する機器である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）焼き物機<\/p><p class=\"ch\">（2）スチームコンベクションオーブン<\/p><p class=\"ch\">（3）ジェットオーブン<\/p><p class=\"ch\">（4）コンベクションオーブン<\/p><img class=\"fig\" src=\"img/q37_image15.jpg\" alt=\"図表\" data-zoom=\"img/q37_image15.jpg\">","choices":4,"answer":2},{"id":"37-188","exam":37,"num":188,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「187」、「188」に答えよ。<\/p><p>K小学校に勤務する栄養教諭である。単独校方式で180食の給食を提供している。調理従事者は、栄養教諭を除いた3名とパートタイマー1名である。パートタイマーをもう1名募集しているが、適任者が見つからない。図は小学校の厨房の図面である。<\/p><\/div><p><b>188<\/b>　その後、Aの場所に、購入した機器を設置した。この機器を積極的に活用するため、調理工程を見直した。翌日の献立は、ご飯、鶏肉の竜田揚げ、小松菜のナムル、人参とキャベツのスープ、牛乳である。購入した機器を用いることにより、調理作業の効率が良くなる料理である。<\/p><p>最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ご飯<\/p><p class=\"ch\">（2）鶏肉の竜田揚げ<\/p><p class=\"ch\">（3）小松菜のナムル<\/p><p class=\"ch\">（4）人参とキャベツのスープ<\/p>","choices":4,"answer":3},{"id":"37-189","exam":37,"num":189,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「189」、「190」、「191」に答えよ。<\/p><p>K社健康保険組合の管理栄養士である。社内の健康診断後、メタボリックシンドロームの予防を目的としたグループカウンセリングを呼びかけたところ、5人の男性社員が集まった。5人とも、通院、服薬なし。<\/p><\/div><p><b>189<\/b>　自己紹介の後、グループカウンセリングの参加のきっかけを聞いた。表は5人の発言の一部である。この発言から行動変容の準備性を把握した。最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）行動変容ステージは、5人とも同じである。<\/p><p class=\"ch\">（2）無関心期(前熟考期)は、4人である。<\/p><p class=\"ch\">（3）準備期は、3人である。<\/p><p class=\"ch\">（4）実行期は、2人である。<\/p><p class=\"ch\">（5）維持期は、1人である。<\/p><img class=\"fig\" src=\"img/q37_image16.jpg\" alt=\"図表\" data-zoom=\"img/q37_image16.jpg\">","choices":5,"answer":5},{"id":"37-190","exam":37,"num":190,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「189」、「190」、「191」に答えよ。<\/p><p>K社健康保険組合の管理栄養士である。社内の健康診断後、メタボリックシンドロームの予防を目的としたグループカウンセリングを呼びかけたところ、5人の男性社員が集まった。5人とも、通院、服薬なし。<\/p><\/div><p><b>190<\/b>　参加者全員の行動変容と、その継続を促すグループカウンセリングの進め方である。優先される進め方として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）AさんとBさんに、今の体型で良いと考えている理由を話してもらう。<\/p><p class=\"ch\">（2）Cさんに、減量に取り組んだ工夫と、減量して良かったことを話してもらう。<\/p><p class=\"ch\">（3）Dさんに、喫煙歴と禁煙の意思について話してもらう。<\/p><p class=\"ch\">（4）Eさんに、結婚した年齢と、結婚後の生活習慣を話してもらう。<\/p>","choices":4,"answer":2},{"id":"37-191","exam":37,"num":191,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「189」、「190」、「191」に答えよ。<\/p><p>K社健康保険組合の管理栄養士である。社内の健康診断後、メタボリックシンドロームの予防を目的としたグループカウンセリングを呼びかけたところ、5人の男性社員が集まった。5人とも、通院、服薬なし。<\/p><\/div><p><b>191<\/b>　Aさんは、毎日間食として、ポテトチップス1袋(60g、325kcal)を食べていた。グループカウンセリングを受けて、Aさんは、間食について当面2週間、取り組む行動目標を設定した。達成できたかどうかを、毎日セルフモニタリングする目標として、最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）ポテトチップスを食べないよう心がける。<\/p><p class=\"ch\">（2）ポテトチップスを食べない。<\/p><p class=\"ch\">（3）ポテトチップスは、1日小袋(30g)1つまでにする。<\/p><p class=\"ch\">（4）ポテトチップスは、1日200kcalまでにする。<\/p>","choices":4,"answer":3},{"id":"37-192","exam":37,"num":192,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「192」、「193」、「194」に答えよ。<\/p><p>K事業所の社員食堂を運営する給食受託会社に勤務する管理栄養士である。給食はクックサーブ方式で運営され、1日昼食500食を提供している。昼食の営業時間は11時30分～13時30分で、提供メニューは2種の定食60％、丼物・カレー20％、麺類20％の構成である。汁物はウォーマーテーブルで温めている。<\/p><\/div><p><b>192<\/b>　味噌汁は、定食2種と丼物・カレーの喫食者に提供される。給食受託会社の味噌汁のレシピは表に示した通りである。この社員食堂の味噌汁に使用する味噌の食塩濃度は、13％である。汁の食塩濃度(％)として、最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）0.6<\/p><p class=\"ch\">（2）0.8<\/p><p class=\"ch\">（3）1.0<\/p><p class=\"ch\">（4）1.2<\/p><p class=\"ch\">（5）1.3<\/p><img class=\"fig\" src=\"img/q37_image17.jpg\" alt=\"図表\" data-zoom=\"img/q37_image17.jpg\">","choices":5,"answer":2},{"id":"37-193","exam":37,"num":193,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「192」、「193」、「194」に答えよ。<\/p><p>K事業所の社員食堂を運営する給食受託会社に勤務する管理栄養士である。給食はクックサーブ方式で運営され、1日昼食500食を提供している。昼食の営業時間は11時30分～13時30分で、提供メニューは2種の定食60％、丼物・カレー20％、麺類20％の構成である。汁物はウォーマーテーブルで温めている。<\/p><\/div><p><b>193<\/b>　ある日、社員Aさんは喫食後に、味噌汁の味がいつもより塩辛かったと調理師に伝え、オフィスに戻った。調理師は作業終了後、管理栄養士にそのことを伝えた。調理師にAさんの喫食時間を聞いたところ、今日はいつもより遅く、13時30分近くであった。味噌汁の食塩濃度に影響を与えたと考えられる要因である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）具材の量<\/p><p class=\"ch\">（2）味噌汁の品質基準<\/p><p class=\"ch\">（3）出来上がり温度<\/p><p class=\"ch\">（4）保温時間<\/p>","choices":4,"answer":4},{"id":"37-194","exam":37,"num":194,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「192」、「193」、「194」に答えよ。<\/p><p>K事業所の社員食堂を運営する給食受託会社に勤務する管理栄養士である。給食はクックサーブ方式で運営され、1日昼食500食を提供している。昼食の営業時間は11時30分～13時30分で、提供メニューは2種の定食60％、丼物・カレー20％、麺類20％の構成である。汁物はウォーマーテーブルで温めている。<\/p><\/div><p><b>194<\/b>　Aさんの意見を受けて、これまでの喫食者の満足度調査を行い、設問193で把握した要因を確認した。味噌汁を適切な品質で提供するための改善策である。<\/p><p>最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）提供時に1杯ずつ食塩濃度を測定する。<\/p><p class=\"ch\">（2）味噌汁の品質基準を変更する。<\/p><p class=\"ch\">（3）保温温度を60℃に下げる。<\/p><p class=\"ch\">（4）営業時間の前半と後半に分けて調味する。<\/p>","choices":4,"answer":4},{"id":"37-195","exam":37,"num":195,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「195」、「196」、「197」に答えよ。<\/p><p>K県健康増進課に勤務する管理栄養士である。K県では、国の結果と比較できるように、国民健康・栄養調査と同じ方法で、県民健康・栄養調査を実施することになった。<\/p><\/div><p><b>195<\/b>　調査員として非常勤の管理栄養士・栄養士を雇用する。調査の精度を高めるために行うべきことである。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）栄養指導の実務経験10年以上の者を雇用する。<\/p><p class=\"ch\">（2）業務で食事調査の経験のある者を雇用する。<\/p><p class=\"ch\">（3）調査方法の手技を確認・練習する研修会を行う。<\/p><p class=\"ch\">（4）調査方法のポイントをまとめ、調査員に配布する。<\/p>","choices":4,"answer":3},{"id":"37-196","exam":37,"num":196,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「195」、「196」、「197」に答えよ。<\/p><p>K県健康増進課に勤務する管理栄養士である。K県では、国の結果と比較できるように、国民健康・栄養調査と同じ方法で、県民健康・栄養調査を実施することになった。<\/p><\/div><p><b>196<\/b>　食事調査の実施前に、世帯の代表者または世帯で主に調理を行う者に対して、説明会を行う。食事記録を行う際の留意点として説明する内容である。誤っているのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）特別な行事などがない、普段の食事の記録をしてください。<\/p><p class=\"ch\">（2）単身赴任など離れて暮らす家族の食事も記録してください。<\/p><p class=\"ch\">（3）家庭外で飲食したものも、記録してください。<\/p><p class=\"ch\">（4）計量できるものは、計量してください。<\/p><p class=\"ch\">（5）計量が難しい場合は、目安量で記録してください。<\/p>","choices":5,"answer":2},{"id":"37-197","exam":37,"num":197,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「195」、「196」、「197」に答えよ。<\/p><p>K県健康増進課に勤務する管理栄養士である。K県では、国の結果と比較できるように、国民健康・栄養調査と同じ方法で、県民健康・栄養調査を実施することになった。<\/p><\/div><p><b>197<\/b>　食事記録内容の確認を行ったところ、飯の量が「茶碗1杯」と記録されていた。この場合に重量を推定するための対応である。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）あらかじめ設定された換算表を用いて推定する。<\/p><p class=\"ch\">（2）調査員の自宅で使用している茶碗の大きさから推定する。<\/p><p class=\"ch\">（3）口頭で、普通盛りか、大盛りかを、対象者に確認して推定する。<\/p><p class=\"ch\">（4）フードモデルや実物大食品カードを用いて、対象者に確認して推定する。<\/p>","choices":4,"answer":4},{"id":"37-198","exam":37,"num":198,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「198」、「199」、「200」に答えよ。<\/p><p>K市健康増進課の管理栄養士である。<\/p><p>K市(5万人)では健康増進計画の一環として、減塩の取組を行ってきた。取組開始時に、食塩摂取量と減塩に対する意識について調査を行っており、減塩に対する意識が高い者の方が食塩摂取量が少なかった。計画は10年計画で、5年目に中間評価を行った。表は過去4年間に行った取組である。<\/p><img class=\"fig\" src=\"img/q37_image18.jpg\" alt=\"図表\" data-zoom=\"img/q37_image18.jpg\"><\/div><p><b>198<\/b>　取組開始時と中間評価時に、それぞれ市民1,000人ずつを無作為抽出し、横断調査を実施した(図1、2)。調査方法は同一である。市民の食塩摂取量の変化に関する記述である。<\/p><p>最も適当なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）集団全体の食塩摂取量の平均値は下がったが、中央値は変わらなかった。<\/p><p class=\"ch\">（2）集団全体の食塩摂取量の平均値及びヒストグラム上の最頻値は下がった。<\/p><p class=\"ch\">（3）集団全体の食塩摂取量の分布のばらつきは大きくなったが、範囲(レンジ)は狭まった。<\/p><p class=\"ch\">（4）第1四分位点未満の者の食塩摂取量は下がったが、第3四分位点以上の者の食塩摂取量は上がった。<\/p><p class=\"ch\">（5）第1四分位点未満の者の人数は減ったが、第3四分位点以上の者の人数は増えた。<\/p><img class=\"fig\" src=\"img/q37_image19.jpg\" alt=\"図表\" data-zoom=\"img/q37_image19.jpg\">","choices":5,"answer":4},{"id":"37-199","exam":37,"num":199,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「198」、「199」、「200」に答えよ。<\/p><p>K市健康増進課の管理栄養士である。<\/p><p>K市(5万人)では健康増進計画の一環として、減塩の取組を行ってきた。取組開始時に、食塩摂取量と減塩に対する意識について調査を行っており、減塩に対する意識が高い者の方が食塩摂取量が少なかった。計画は10年計画で、5年目に中間評価を行った。表は過去4年間に行った取組である。<\/p><img class=\"fig\" src=\"img/q37_image18.jpg\" alt=\"図表\" data-zoom=\"img/q37_image18.jpg\"><\/div><p><b>199<\/b>　図1から図2に至った食塩摂取量の変化の理由について、表の4年間の取組から考察した。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）減塩レシピを、市のウェブサイトで掲載したため<\/p><p class=\"ch\">（2）減塩に対する意識の高い人向けの取組になっていたため<\/p><p class=\"ch\">（3）参加者人数が限られていたため<\/p><p class=\"ch\">（4）実施頻度が少なかったため<\/p>","choices":4,"answer":2},{"id":"37-200","exam":37,"num":200,"subject":10,"qhtml":"<div class=\"stem\"><p>次の文を読み「198」、「199」、「200」に答えよ。<\/p><p>K市健康増進課の管理栄養士である。<\/p><p>K市(5万人)では健康増進計画の一環として、減塩の取組を行ってきた。取組開始時に、食塩摂取量と減塩に対する意識について調査を行っており、減塩に対する意識が高い者の方が食塩摂取量が少なかった。計画は10年計画で、5年目に中間評価を行った。表は過去4年間に行った取組である。<\/p><img class=\"fig\" src=\"img/q37_image18.jpg\" alt=\"図表\" data-zoom=\"img/q37_image18.jpg\"><\/div><p><b>200<\/b>　食塩摂取量の変化とその考察を踏まえて、市民の食塩摂取状況の課題解決に向けて、取組を見直した。最も適切なのはどれか。1つ選べ。<\/p><p class=\"ch\">（1）民間のレシピサイト運営会社と連携し、民間のサイトで、市の減塩レシピの情報発信を行うことにした。<\/p><p class=\"ch\">（2）市民公開講座の会場を、収容人数が大きい施設に変更することにした。<\/p><p class=\"ch\">（3）調理実習の回数を増やし、土日の開催も行うことにした。<\/p><p class=\"ch\">（4）市内のスーパーマーケットと協働して、減塩をうたわず、弁当や惣菜中の食塩量の低減を行うことにした。<\/p>","choices":4,"answer":4},{"id":"38-001","exam":38,"num":1,"subject":1,"qimg":["img/q38_001.jpg"],"choices":5,"answer":5},{"id":"38-002","exam":38,"num":2,"subject":1,"qimg":["img/q38_002.jpg"],"choices":5,"answer":5},{"id":"38-003","exam":38,"num":3,"subject":1,"qimg":["img/q38_003.jpg"],"choices":5,"answer":3},{"id":"38-004","exam":38,"num":4,"subject":1,"qimg":["img/q38_004.jpg"],"choices":5,"answer":4},{"id":"38-005","exam":38,"num":5,"subject":1,"qimg":["img/q38_005.jpg"],"choices":5,"answer":5},{"id":"38-006","exam":38,"num":6,"subject":1,"qimg":["img/q38_006.jpg"],"choices":5,"answer":3},{"id":"38-007","exam":38,"num":7,"subject":1,"qimg":["img/q38_007.jpg"],"choices":5,"answer":2},{"id":"38-008","exam":38,"num":8,"subject":1,"qimg":["img/q38_008.jpg"],"choices":5,"answer":4},{"id":"38-009","exam":38,"num":9,"subject":1,"qimg":["img/q38_009.jpg"],"choices":5,"answer":4},{"id":"38-010","exam":38,"num":10,"subject":1,"qimg":["img/q38_010.jpg"],"choices":5,"answer":4},{"id":"38-011","exam":38,"num":11,"subject":1,"qimg":["img/q38_011.jpg"],"choices":5,"answer":1},{"id":"38-012","exam":38,"num":12,"subject":1,"qimg":["img/q38_012.jpg"],"choices":5,"answer":3},{"id":"38-013","exam":38,"num":13,"subject":1,"qimg":["img/q38_013.jpg"],"choices":5,"answer":3},{"id":"38-014","exam":38,"num":14,"subject":1,"qimg":["img/q38_014.jpg"],"choices":5,"answer":3},{"id":"38-015","exam":38,"num":15,"subject":1,"qimg":["img/q38_015.jpg"],"choices":5,"answer":5},{"id":"38-016","exam":38,"num":16,"subject":1,"qimg":["img/q38_016.jpg"],"choices":5,"answer":4},{"id":"38-017","exam":38,"num":17,"subject":2,"qimg":["img/q38_017.jpg"],"choices":5,"answer":1},{"id":"38-018","exam":38,"num":18,"subject":2,"qimg":["img/q38_018.jpg"],"choices":5,"answer":5},{"id":"38-019","exam":38,"num":19,"subject":2,"qimg":["img/q38_019.jpg"],"choices" }
function pool() {
  return all.filter(q => state.exams.has(q.exam) && (state.mode !== "focus" || state.subjects.has(q.subject)));
}

function home() {
  const cs = subjectStats();
  const acc = c => { const s = cs[c], n = s.right + s.wrong; return n ? `正答率 ${Math.round(s.right / n * 100)}%（${n}回）` : "未解答"; };
  const counts = c => all.filter(q => q.subject === c && state.exams.has(q.exam)).length;
  const p = pool();
  const MODES = [
    ["all", "全体からランダム", "すべての単元の過去問から、まんべんなく出題します"],
    ["weak", "間違いの多い単元を中心に", "正答率の低い単元ほど多く出題します。前回まちがえた問題も出やすくなります"],
    ["focus", "苦手な単元を選んで集中", "下で選んだ単元だけから出題します"],
  ];
  $("#app").innerHTML = `
    <h1>管理栄養士国家試験 過去問</h1>
    <p class="sub">第${exams[0]}回〜第${exams[exams.length - 1]}回の国家試験から全${all.length}問。解答すると、正誤と一緒に「何回（何年）の何番の問題か」を表示します。</p>
    <div class="card">
      <h2 style="margin-top:0">出題のしかた</h2>
      <div class="mode">${MODES.map(([k, t, d]) => `<button data-m="${k}" class="${state.mode === k ? "on" : ""}"><b>${t}</b><span>${d}</span></button>`).join("")}</div>
      <h2>${state.mode === "focus" ? "出題する単元（苦手な単元を選ぶ）" : "単元ごとの成績"}</h2>
      ${state.mode === "focus" ? `<div class="seg" style="margin-bottom:6px"><button class="mini" id="selall">すべて選ぶ</button><button class="mini" id="selnone">すべて外す</button><button class="mini" id="selweak">正答率の低い3単元</button></div>` : ""}
      ${subjects.map(c => state.mode === "focus"
        ? `<label class="row"><input type="checkbox" data-sj="${c}" ${state.subjects.has(c) ? "checked" : ""}><span>${esc(SUBJECTS[c])}<span class="sub">（${counts(c)}問｜${acc(c)}）</span></span></label>`
        : `<div class="subj"><span>${esc(SUBJECTS[c])}</span><span class="sub">${counts(c)}問｜${acc(c)}</span></div>`).join("")}
      <h2>出題する回</h2>
      <div class="seg">${exams.map(e => `<button data-ex="${e}" class="${state.exams.has(e) ? "on" : ""}">第${e}回<span class="sub" style="display:block;margin:0">${esc(EXAMS[e])}</span></button>`).join("")}</div>
      <h2>問題数</h2>
      <div class="seg">${[10, 20, 50].map(n => `<button data-n="${n}" class="${state.count === n ? "on" : ""}">${n}問</button>`).join("")}</div>
    </div>
    <button class="primary" id="start" ${p.length ? "" : "disabled"}>${p.length ? `開始（対象 ${p.length}問）` : (state.exams.size ? "単元を1つ以上選んでください" : "回を1つ以上選んでください")}</button>
    <p class="foot">成績はこの端末のブラウザにだけ保存されます（他の端末やほかの人とは共有されません）。<button class="link" id="reset">成績を消去</button><br>
    問題：厚生労働省 管理栄養士国家試験（第37〜40回）。正答：厚生労働省の公表による。</p>`;
  document.querySelectorAll("[data-m]").forEach(el => el.onclick = () => { state.mode = el.dataset.m; home(); });
  document.querySelectorAll("[data-sj]").forEach(el => el.onchange = () => { const c = +el.dataset.sj; el.checked ? state.subjects.add(c) : state.subjects.delete(c); home(); });
  document.querySelectorAll("[data-ex]").forEach(el => el.onclick = () => { const e = +el.dataset.ex; state.exams.has(e) ? state.exams.delete(e) : state.exams.add(e); home(); });
  document.querySelectorAll("[data-n]").forEach(el => el.onclick = () => { state.count = +el.dataset.n; home(); });
  if ($("#selall")) {
    $("#selall").onclick = () => { state.subjects = new Set(subjects); home(); };
    $("#selnone").onclick = () => { state.subjects = new Set(); home(); };
    $("#selweak").onclick = () => {
      const rate = c => { const s = cs[c], n = s.right + s.wrong; return n ? s.right / n : 2; };
      state.subjects = new Set(subjects.filter(c => cs[c].right + cs[c].wrong).sort((a, b) => rate(a) - rate(b)).slice(0, 3));
      if (!state.subjects.size) alert("まだ解答の記録がありません。先に「全体からランダム」で解いてみてください。");
      home();
    };
  }
  $("#reset").onclick = e => {
    if (e.target.dataset.armed) { stats = {}; saveStats(stats); home(); return; }
    e.target.dataset.armed = "1"; e.target.textContent = "もう一度押すと成績を消去します";
  };
  $("#start").onclick = () => {
    const p = pool(), n = Math.min(state.count, p.length);
    if (state.mode === "weak") { const cs = subjectStats(); state.queue = weightedSample(p, q => weakWeight(q, cs), n); }
    else state.queue = shuffle(p).slice(0, n);
    state.idx = 0; state.results = []; question();
  };
}

function body(q) {
  if (q.qhtml) return `<div class="qtext">${q.qhtml}</div>`;
  return `<div class="stack">${q.qimg.map(src => `<img class="page" src="${src}" alt="問題文（第${q.exam}回 問${q.num}）" data-zoom="${src}">`).join("")}</div>`;
}
function bindZoom() {
  document.querySelectorAll("[data-zoom]").forEach(img => img.onclick = () => {
    const z = document.createElement("div"); z.className = "zoom";
    z.innerHTML = `<img src="${img.dataset.zoom}" alt="拡大表示"><button>閉じる</button>`;
    z.querySelector("button").onclick = () => z.remove();
    document.body.appendChild(z);
  });
}
function preload(q) { if (q && q.qimg) q.qimg.forEach(src => { const i = new Image(); i.src = src; }); }

function question() {
  const q = state.queue[state.idx];
  $("#app").innerHTML = `
    <div class="meta"><span>${state.idx + 1} / ${state.queue.length}</span><button class="link" id="quit">中断してもどる</button></div>
    <div class="bar"><i style="width:${state.idx / state.queue.length * 100}%"></i></div>
    <div class="card">
      <span class="tag">${esc(SUBJECTS[q.subject])}</span>
      <div style="margin-top:10px">${body(q)}</div>
      <p class="hint">${q.qhtml ? "図はタップすると拡大します" : "問題の画像はタップすると拡大します"}</p>
      <p style="margin:6px 0 8px"><b>答えを1つ選んでください</b></p>
      <div id="input"><div class="choices">${Array.from({ length: q.choices }, (_, i) => `<button data-c="${i + 1}">(${i + 1})</button>`).join("")}</div></div>
      <div id="result"></div>
    </div>
    <div id="next"></div>`;
  $("#quit").onclick = home;
  bindZoom();
  document.querySelectorAll("#input [data-c]").forEach(b => b.onclick = () => judge(q, +b.dataset.c));
  preload(state.queue[state.idx + 1]);
  window.scrollTo(0, 0);
}

function judge(q, picked) {
  const right = picked === q.answer;
  state.results.push({ q, right, picked });
  const s = stats[q.id] || { right: 0, wrong: 0 };
  right ? s.right++ : s.wrong++; s.last = right; stats[q.id] = s; saveStats(stats);
  document.querySelectorAll("#input button").forEach(b => {
    b.disabled = true;
    const c = +b.dataset.c;
    if (c === q.answer) b.classList.add("correct"); else if (c === picked) b.classList.add("wrong");
  });
  $("#result").innerHTML = `
    <p></p>
    <div class="verdict ${right ? "ok" : "ng"}">${right ? "正解" : "不正解"}　正答：(${q.answer})</div>
    <div class="source"><b>出典</b>：${esc(source(q))}<br><span class="sub">単元：${esc(SUBJECTS[q.subject])}</span></div>`;
  const last = state.idx === state.queue.length - 1;
  $("#next").innerHTML = `<button class="primary" id="go">${last ? "結果を見る" : "次の問題へ"}</button>`;
  $("#go").onclick = () => { if (last) result(); else { state.idx++; question(); } };
  $("#go").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function result() {
  const r = state.results, ok = r.filter(x => x.right).length;
  const by = {};
  r.forEach(x => { const c = by[x.q.subject] ||= { n: 0, ok: 0 }; c.n++; if (x.right) c.ok++; });
  const miss = r.filter(x => !x.right);
  $("#app").innerHTML = `
    <h1>結果</h1>
    <div class="card"><div class="big">${ok} / ${r.length}</div><div class="sub">正答率 ${Math.round(ok / r.length * 100)}%</div>
      ${Object.entries(by).sort((a, b) => a[0] - b[0]).map(([c, v]) => `<div>${esc(SUBJECTS[c])}　${v.ok}/${v.n}</div><div class="bar"><i style="width:${v.ok / v.n * 100}%"></i></div>`).join("")}
    </div>
    ${miss.length ? `<h2>まちがえた問題</h2><div class="card stack">${miss.map(x => `<div><b>${esc(source(x.q))}</b><div class="sub" style="margin:0">${esc(SUBJECTS[x.q.subject])}｜あなたの答え (${x.picked})｜正答 (${x.q.answer})</div></div>`).join("")}</div>` : ""}
    ${miss.length ? `<button class="primary" id="retry" style="margin-bottom:10px">まちがえた問題をもう一度解く</button>` : ""}
    <button class="primary" id="home">最初の画面へ</button>`;
  $("#home").onclick = home;
  if ($("#retry")) $("#retry").onclick = () => { state.queue = shuffle(miss.map(x => x.q)); state.idx = 0; state.results = []; question(); };
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
